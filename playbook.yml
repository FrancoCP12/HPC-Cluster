# ============================================================================
# Playbook Ansible — Clúster HPC Slurm + GPUs + OpenLDAP + NFS + Open OnDemand
# Diseñado para despliegue limpio y reproducible exclusivo en Ubuntu 26.04
# ============================================================================

# ----------------------------------------------------------------------------
# 0. Recolección global de facts y preparación base
# ----------------------------------------------------------------------------
- name: "Paso 0: Recolección global y limpieza de locks"
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Garantizar sudo sin contraseña prioritario para el operador Ansible
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/99-ansible-operator"
        content: "{{ ansible_user | default(ansible_env.USER) }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

    - name: Deshabilitar actualizaciones desatendidas para evitar bloqueos de apt
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
        - unattended-upgrades
      failed_when: false

# ----------------------------------------------------------------------------
# 0.5. Servidor OpenLDAP Centralizado con TLS
# ----------------------------------------------------------------------------
- name: "Aprovisionar Servidor OpenLDAP con TLS"
  hosts: ldap_server
  become: true
  tags: [ldap]
  tasks:
    - name: Asegurar paquetes de slapd, utilidades y openssl
      ansible.builtin.apt:
        name:
          - slapd
          - ldap-utils
          - openssl
          - ssl-cert
          - python3-passlib
        state: present
        update_cache: false

    - name: Asegurar directorio para certificados TLS
      ansible.builtin.file:
        path: /etc/ldap/ssl
        state: directory
        owner: openldap
        group: openldap
        mode: '0750'

    - name: Generar clave privada TLS para slapd
      ansible.builtin.command: openssl genrsa -out /etc/ldap/ssl/ldap.key 2048
      args:
        creates: /etc/ldap/ssl/ldap.key

    - name: Generar certificado autofirmado (10 años de validez)
      ansible.builtin.command: >
        openssl req -new -x509 -nodes -sha256 -days 3650
        -key /etc/ldap/ssl/ldap.key
        -out /etc/ldap/ssl/ldap.crt
        -subj "/C=AR/ST=Mendoza/L=San Rafael/O=UTN/CN={{ inventory_hostname }}"
      args:
        creates: /etc/ldap/ssl/ldap.crt

    - name: Fijar permisos estrictos para openldap en clave y certificado
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: openldap
        group: openldap
        mode: "{{ item.mode }}"
      loop:
        - { path: '/etc/ldap/ssl/ldap.key', mode: '0600' }
        - { path: '/etc/ldap/ssl/ldap.crt', mode: '0644' }

    - name: Habilitar servicio LDAPS en /etc/default/slapd
      ansible.builtin.lineinfile:
        path: /etc/default/slapd
        regexp: '^SLAPD_SERVICES='
        line: 'SLAPD_SERVICES="ldap:/// ldaps:/// ldapi:///"'
      notify: Reiniciar slapd

    - name: Forzar reinicio para aplicar LDAPS
      ansible.builtin.meta: flush_handlers

    - name: Generar hash SSHA de la contraseña del admin de LDAP
      ansible.builtin.command: slappasswd -s "{{ ldap_admin_password }}"
      register: ldap_admin_ssha
      changed_when: false

    - name: Generar hash SSHA de la contraseña del usuario de prueba
      ansible.builtin.command: slappasswd -s "{{ ldap_test_user_password }}"
      register: ldap_test_user_ssha
      changed_when: false

    - name: Crear archivo LDIF para configurar base de datos y TLS en cn=config
      ansible.builtin.copy:
        dest: /tmp/setup_config.ldif
        owner: root
        group: root
        mode: '0600'
        content: |
          dn: cn=config
          changetype: modify
          replace: olcTLSCertificateFile
          olcTLSCertificateFile: /etc/ldap/ssl/ldap.crt
          -
          replace: olcTLSCertificateKeyFile
          olcTLSCertificateKeyFile: /etc/ldap/ssl/ldap.key
          -
          replace: olcTLSVerifyClient
          olcTLSVerifyClient: never

          dn: olcDatabase={1}mdb,cn=config
          changetype: modify
          replace: olcSuffix
          olcSuffix: {{ ldap_search_base }}
          -
          replace: olcRootDN
          olcRootDN: {{ ldap_admin_dn }}
          -
          replace: olcRootPW
          olcRootPW: {{ ldap_admin_ssha.stdout }}

    - name: Aplicar configuración de base de datos y TLS en cn=config
      ansible.builtin.command: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/setup_config.ldif
      register: conf_out
      changed_when: "'modifying entry' in conf_out.stdout"
      failed_when:
        - conf_out.rc != 0
        - "'Type or value exists' not in conf_out.stderr"

    - name: Crear archivo LDIF con nodo raíz y unidades organizativas
      ansible.builtin.copy:
        dest: /tmp/base_tree.ldif
        owner: root
        group: root
        mode: '0600'
        content: |
          dn: {{ ldap_search_base }}
          objectClass: top
          objectClass: dcObject
          objectClass: organization
          o: UTN HPC
          dc: utn

          dn: {{ ldap_user_search_base }}
          objectClass: top
          objectClass: organizationalUnit
          ou: People

          dn: {{ ldap_group_search_base }}
          objectClass: top
          objectClass: organizationalUnit
          ou: Groups

          dn: cn=investigacion,{{ ldap_group_search_base }}
          objectClass: top
          objectClass: posixGroup
          cn: investigacion
          gidNumber: 2000

    - name: Cargar árbol base en OpenLDAP
      ansible.builtin.command: >
        ldapadd -x -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_password }}" -H ldapi:/// -f /tmp/base_tree.ldif
      register: tree_out
      changed_when: "'adding new entry' in tree_out.stdout"
      failed_when:
        - tree_out.rc != 0
        - "'Already exists' not in tree_out.stderr"

    - name: Crear LDIF para usuario de prueba
      ansible.builtin.copy:
        dest: /tmp/test_user.ldif
        owner: root
        group: root
        mode: '0600'
        content: |
          dn: uid={{ ldap_test_user }},{{ ldap_user_search_base }}
          objectClass: top
          objectClass: person
          objectClass: organizationalPerson
          objectClass: inetOrgPerson
          objectClass: posixAccount
          objectClass: shadowAccount
          cn: Usuario {{ ldap_test_user }}
          sn: Prueba
          uid: {{ ldap_test_user }}
          uidNumber: {{ ldap_test_user_uid }}
          gidNumber: {{ ldap_test_user_gid | default(2000) }}
          homeDirectory: {{ ldap_test_user_home | default('/home/' + ldap_test_user) }}
          loginShell: /bin/bash
          userPassword: {{ ldap_test_user_ssha.stdout }}
          mail: {{ ldap_test_user }}@utn.edu.ar

    - name: Cargar usuario de prueba en OpenLDAP
      ansible.builtin.command: >
        ldapadd -x -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_password }}" -H ldapi:/// -f /tmp/test_user.ldif
      register: user_out
      changed_when: "'adding new entry' in user_out.stdout"
      failed_when:
        - user_out.rc != 0
        - "'Already exists' not in user_out.stderr"

    - name: Generar hash SSHA de la contraseña del segundo usuario de prueba
      ansible.builtin.command: slappasswd -s "{{ ldap_second_user_password }}"
      register: ldap_second_user_ssha
      changed_when: false

    - name: Crear LDIF para el segundo usuario de prueba
      ansible.builtin.copy:
        dest: /tmp/second_user.ldif
        owner: root
        group: root
        mode: '0600'
        content: |
          dn: uid={{ ldap_second_user }},{{ ldap_user_search_base }}
          objectClass: top
          objectClass: person
          objectClass: organizationalPerson
          objectClass: inetOrgPerson
          objectClass: posixAccount
          objectClass: shadowAccount
          cn: Alumno {{ ldap_second_user }}
          sn: Prueba
          uid: {{ ldap_second_user }}
          uidNumber: {{ ldap_second_user_uid }}
          gidNumber: {{ ldap_second_user_gid }}
          homeDirectory: {{ ldap_second_user_home }}
          loginShell: /bin/bash
          userPassword: {{ ldap_second_user_ssha.stdout }}
          mail: {{ ldap_second_user }}@{{ ldap_domain }}

    - name: Cargar segundo usuario de prueba en OpenLDAP
      ansible.builtin.command: >
        ldapadd -x -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_password }}" -H ldapi:/// -f /tmp/second_user.ldif
      register: second_user_out
      changed_when: "'adding new entry' in second_user_out.stdout"
      failed_when:
        - second_user_out.rc != 0
        - "'Already exists' not in second_user_out.stderr"

    - name: Crear LDIF que corrige uidNumber, gidNumber, homeDirectory y userPassword
      # ldapadd tolera "Already exists", asi que una entrada creada a mano con un
      # uidNumber repetido NUNCA se corrige sola: getent sigue devolviendo el mismo
      # uid para los dos usuarios y el home de uno queda propiedad del otro. Por eso
      # el uid se impone con 'replace', que es idempotente y pisa el valor previo.
      #
      # userPassword va por el mismo motivo y es lo que rompe el login: si la entrada
      # se creo sin hash (o con un hash viejo), ldapadd la deja pasar por el
      # "Already exists" y el bind falla con 'Invalid credentials (49)', que Apache
      # reporta como 401 en /pun y /grafana aunque LDAP este perfecto.
      ansible.builtin.copy:
        dest: /tmp/fix_uids.ldif
        owner: root
        group: root
        mode: '0600'
        content: |
          dn: uid={{ ldap_test_user }},{{ ldap_user_search_base }}
          changetype: modify
          replace: uidNumber
          uidNumber: {{ ldap_test_user_uid }}
          -
          replace: gidNumber
          gidNumber: {{ ldap_test_user_gid }}
          -
          replace: homeDirectory
          homeDirectory: {{ ldap_test_user_home }}
          -
          replace: userPassword
          userPassword: {{ ldap_test_user_ssha.stdout }}

          dn: uid={{ ldap_second_user }},{{ ldap_user_search_base }}
          changetype: modify
          replace: uidNumber
          uidNumber: {{ ldap_second_user_uid }}
          -
          replace: gidNumber
          gidNumber: {{ ldap_second_user_gid }}
          -
          replace: homeDirectory
          homeDirectory: {{ ldap_second_user_home }}
          -
          replace: userPassword
          userPassword: {{ ldap_second_user_ssha.stdout }}

    - name: Aplicar correccion de uidNumber a ambos usuarios
      ansible.builtin.command: >
        ldapmodify -x -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_password }}" -H ldapi:/// -f /tmp/fix_uids.ldif
      register: fix_uids_out
      changed_when: "'modifying entry' in fix_uids_out.stdout"
      failed_when: false
      notify: Reiniciar slapd

    - name: Verificar que los dos usuarios ya no comparten uidNumber
      # Guard explicito: si los uids siguen duplicados, el home del segundo
      # usuario se va a crear con el uid del primero y el problema vuelve en
      # forma de permisos ilegibles, mucho mas dificil de detectar.
      ansible.builtin.command: >
        ldapsearch -x -D "{{ ldap_admin_dn }}" -w "{{ ldap_admin_password }}" -H ldapi:///
        -b "{{ ldap_user_search_base }}" "(objectClass=posixAccount)" uid uidNumber
      register: uid_check
      changed_when: false
      failed_when:
        - uid_check.rc != 0
        - (uid_check.stdout_lines | map('regex_replace', '^uid(?:Number)?: (.+)$', '\1')
           | select('match', '^[0-9]+$') | list | length) > 0
        - (uid_check.stdout_lines | map('regex_replace', '^uidNumber: (.+)$', '\1')
           | select('match', '^[0-9]+$') | list | unique | length) != 2

  handlers:
    - name: Reiniciar slapd
      ansible.builtin.systemd:
        name: slapd
        state: restarted

# ----------------------------------------------------------------------------
# 1. Infraestructura Base: Sudo, Tiempo, Munge, SSSD y Clientes Slurm
# ----------------------------------------------------------------------------
- name: "1. Infraestructura base, sincronización horaria y autenticación común"
  hosts: all
  serial: 1
  become: true
  tasks:
    - name: Asegurar repositorios y paquetes de sistema
      ansible.builtin.apt:
        name:
          - software-properties-common
          - chrony
          - munge
          - libmunge-dev
          - sssd
          - sssd-tools
          - libpam-sss
          - libnss-sss
          - libpam-modules
        state: present
        update_cache: true

    - name: Iniciar Chrony
      ansible.builtin.systemd:
        name: chrony
        state: started
        enabled: true

    - name: Forzar paso de reloj inicial con Chrony
      ansible.builtin.command: chronyc makestep 1 -1
      changed_when: false
      failed_when: false

    - name: Garantizar resolución estática en /etc/hosts para todos los nodos
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item]['ansible_host'] | default(hostvars[item]['ansible_facts']['default_ipv4']['address'] | default(item)) }} {{ hostvars[item]['ansible_facts']['hostname'] | default(item) }}"
        state: present
      loop: "{{ groups['all'] }}"

    - name: Asegurar grupo del sistema para Slurm
      ansible.builtin.group:
        name: "{{ slurm_group | default('slurm') }}"
        gid: "{{ slurm_gid | default(1100) }}"
        system: true
        state: present

    - name: Asegurar usuario del sistema para Slurm
      ansible.builtin.user:
        name: "{{ slurm_user | default('slurm') }}"
        uid: "{{ slurm_uid | default(1100) }}"
        group: "{{ slurm_group | default('slurm') }}"
        system: true
        shell: /bin/false
        create_home: false
        state: present

    - name: Persistir directorio de runtime /run/slurm
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/slurm.conf
        content: "d /run/slurm 0755 {{ slurm_user | default('slurm') }} {{ slurm_group | default('slurm') }} -\n"
        mode: '0644'

    - name: Aplicar tmpfiles de Slurm
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/slurm.conf
      changed_when: false

    - name: Generar munge.key únicamente en el nodo maestro
      ansible.builtin.command: create-munge-key -f
      args:
        creates: /etc/munge/munge.key
      delegate_to: "{{ groups['master'][0] }}"
      run_once: true

    - name: Leer munge.key del maestro
      ansible.builtin.slurp:
        src: /etc/munge/munge.key
      delegate_to: "{{ groups['master'][0] }}"
      run_once: true
      register: munge_key_master

    - name: Distribuir munge.key con permisos 0400 en todos los nodos
      ansible.builtin.copy:
        content: "{{ munge_key_master['content'] | b64decode }}"
        dest: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'
      notify: Reiniciar munge

    - name: Iniciar servicio munge
      ansible.builtin.systemd:
        name: munge
        state: started
        enabled: true

    - name: Desplegar configuración de SSSD
      ansible.builtin.template:
        src: templates/sssd.conf.j2
        dest: /etc/sssd/sssd.conf
        owner: root
        group: root
        mode: '0600'
      notify: Reiniciar sssd

    - name: Habilitar mkhomedir
      ansible.builtin.command: pam-auth-update --enable mkhomedir
      changed_when: false

    - name: Iniciar y habilitar servicio SSSD
      ansible.builtin.systemd:
        name: sssd
        state: started
        enabled: true

    - name: Limpiar y recrear directorio temporal de paquetes Slurm
      ansible.builtin.file:
        path: /tmp/slurm_packages
        state: "{{ item }}"
        mode: '0755'
      loop:
        - absent
        - directory

    - name: Copiar debs de Slurm cliente desde packages/ubuntu26/
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /tmp/slurm_packages/
        mode: '0644'
      with_fileglob:
        - "packages/ubuntu26/slurm-smd_*.deb"
        - "packages/ubuntu26/slurm-smd-client_*.deb"

    - name: Instalar debs de cliente
      ansible.builtin.shell: >
        DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" install
        /tmp/slurm_packages/*.deb
      register: apt_base
      changed_when: "'Setting up' in apt_base.stdout"

  handlers:
    - name: Reiniciar munge
      ansible.builtin.systemd:
        name: munge
        state: restarted

    - name: Reiniciar sssd
      ansible.builtin.systemd:
        name: sssd
        state: restarted

# ----------------------------------------------------------------------------
# 2. Base de Datos y Demonio SlurmDBD
# ----------------------------------------------------------------------------
- name: "2. Aprovisionar Base de Datos y SlurmDBD"
  hosts: database
  become: true
  tasks:
    - name: Instalar MySQL Server y dependencias Python
      ansible.builtin.apt:
        name:
          - mysql-server
          - mysql-client
          - python3-pymysql
        state: present
        update_cache: true

    - name: Iniciar servicio MySQL
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true

    - name: Configurar escucha en 0.0.0.0 de MySQL
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^\s*bind-address\s*=.*'
        line: 'bind-address = 0.0.0.0'
      notify: Reiniciar mysql

    - name: Forzar flush para aplicar bind-address
      ansible.builtin.meta: flush_handlers

    - name: Crear base de datos para SlurmDBD
      ansible.builtin.command: >
        mysql -u root --socket=/var/run/mysqld/mysqld.sock -e
        "CREATE DATABASE IF NOT EXISTS {{ slurm_db_name | default('slurm_acct_db') }};"
      changed_when: false

    - name: Crear usuario de SlurmDBD en MySQL
      ansible.builtin.command: >
        mysql -u root --socket=/var/run/mysqld/mysqld.sock -e
        "CREATE USER IF NOT EXISTS '{{ slurm_db_user }}'@'%' IDENTIFIED BY '{{ slurm_db_password }}';
         ALTER USER '{{ slurm_db_user }}'@'%' IDENTIFIED BY '{{ slurm_db_password }}';
         GRANT ALL PRIVILEGES ON {{ slurm_db_name | default('slurm_acct_db') }}.* TO '{{ slurm_db_user }}'@'%';
         CREATE USER IF NOT EXISTS '{{ slurm_db_user }}'@'localhost' IDENTIFIED BY '{{ slurm_db_password }}';
         ALTER USER '{{ slurm_db_user }}'@'localhost' IDENTIFIED BY '{{ slurm_db_password }}';
         GRANT ALL PRIVILEGES ON {{ slurm_db_name | default('slurm_acct_db') }}.* TO '{{ slurm_db_user }}'@'localhost';
         FLUSH PRIVILEGES;"
      no_log: true
      changed_when: false

    - name: Asegurar directorio temporal para deb de slurmdbd
      ansible.builtin.file:
        path: /tmp/slurm_debs
        state: directory
        mode: '0755'

    - name: Copiar paquete slurmdbd desde packages/ubuntu26/
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /tmp/slurm_debs/
        mode: '0644'
      with_fileglob:
        - "packages/ubuntu26/slurm-smd-slurmdbd_*.deb"

    - name: Instalar paquete slurmdbd
      ansible.builtin.shell: >
        DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" install
        /tmp/slurm_debs/slurm-smd-slurmdbd_*.deb
      register: apt_dbd
      changed_when: "'Setting up' in apt_dbd.stdout"

    - name: Directorios de SlurmDBD
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: '0755'
      loop:
        - /etc/slurm
        - /var/log/slurm
        - /run/slurm

    - name: Desplegar slurmdbd.conf con permisos estrictos 0600
      ansible.builtin.template:
        src: templates/slurmdbd.conf.j2
        dest: /etc/slurm/slurmdbd.conf
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: '0600'
      no_log: true
      notify: Reiniciar slurmdbd

    - name: Iniciar y habilitar servicio slurmdbd
      ansible.builtin.systemd:
        name: slurmdbd
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Reiniciar mysql
      ansible.builtin.systemd:
        name: mysql
        state: restarted

    - name: Reiniciar slurmdbd
      ansible.builtin.systemd:
        name: slurmdbd
        state: restarted

    - name: Reiniciar slurmrestd
      ansible.builtin.systemd:
        name: slurmrestd
        state: restarted
        daemon_reload: true

# ----------------------------------------------------------------------------
# 3. Controlador Maestro Slurm (slurmctld)
# ----------------------------------------------------------------------------
- name: "3. Aprovisionar Controlador Maestro (slurmctld)"
  hosts: master
  become: true
  tasks:
    - name: Asegurar directorio temporal para deb de slurmctld
      ansible.builtin.file:
        path: /tmp/slurm_debs
        state: directory
        mode: '0755'

    - name: Copiar paquete slurmctld desde packages/ubuntu26/
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /tmp/slurm_debs/
        mode: '0644'
      with_fileglob:
        - "packages/ubuntu26/slurm-smd-slurmctld_*.deb"

    - name: Buscar paquete .deb de slurmctld
      ansible.builtin.find:
        paths: /tmp/slurm_debs
        patterns: "slurm-smd-slurmctld_*.deb"
      register: slurmctld_deb

    - name: Instalar paquete slurmctld
      ansible.builtin.apt:
        deb: "{{ slurmctld_deb.files[0].path }}"
        state: present
      when: slurmctld_deb.files | length > 0

    - name: Directorios de runtime y spool de slurmctld
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: '0755'
      loop:
        - /etc/slurm
        - /var/log/slurm
        - /run/slurm
        - /var/spool/slurmctld

    # --- slurmrestd: API REST de Slurm para el exporter de Prometheus --------
    # El build de Slurm 24.11.7 de packages/ NO trae endpoint OpenMetrics: en el
    # arbol de fuentes no hay ninguna cadena "metrics" bajo src/slurmrestd/, asi
    # que /slurm/v1/metrics no existe y no hay nada que scrapear ahi. Lo que si
    # sirve es la API REST, que es la que consume files/prometheus/slurm_exporter.py.
    #
    # Detalles no obvios de este demonio, todos verificados contra el fuente y
    # contra el comportamiento real:
    #
    # 1) NO existe un archivo de configuracion propio de slurmrestd. En todo el
    #    arbol de fuentes no hay ninguna referencia a "slurmrestd.conf": el flag
    #    -f apunta al slurm.conf normal. Por eso un slurmrestd.conf propio con
    #    ListenAddr= falla con "unrecognized key: ListenAddr".
    # 2) La direccion de escucha es un ARGUMENTO POSICIONAL ("[host]:port" o
    #    "unix:/ruta"), no una clave de configuracion. De ahi el ListenAddr.
    # 3) Rechaza root ("should not be run as the root user"), SlurmUser
    #    ("should not be run as SlurmUser") y el grupo de SlurmUser
    #    ("should not be run with SlurmUser's group"). Necesita usuario y grupo
    #    propios. Cuidado: si el usuario quedo antes en el grupo slurm hay que
    #    sacarlo (groups: [] con append: false), si no sigue abortando.
    # 4) Los unicos plugins de autenticacion de este build son rest_auth/local y
    #    rest_auth/jwt. No hay auth/basic, asi que por TCP habria que emitir JWT.
    #    Con socket UNIX se usa rest_auth/local y no hay que manejar claves.
    # 5) La API es versionada: /slurm/v0.0.42/... y no /slurm/v1/... como de
    #    costumbre. /slurm/v1 responde 404.
    - name: Copiar paquete slurmrestd desde packages/ubuntu26/
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /tmp/slurm_debs/
        mode: '0644'
      with_fileglob:
        - "packages/ubuntu26/slurm-smd-slurmrestd_*.deb"

    - name: Buscar paquete .deb de slurmrestd
      ansible.builtin.find:
        paths: /tmp/slurm_debs
        patterns: "slurm-smd-slurmrestd_*.deb"
      register: slurmrestd_deb

    - name: Dependencia de libhttp-parser para slurmrestd
      # slurmrestd linka contra libhttp-parser2.9; sin esto no arranca.
      ansible.builtin.apt:
        name: libhttp-parser2.9
        state: present

    - name: Instalar paquete slurmrestd
      ansible.builtin.apt:
        deb: "{{ slurmrestd_deb.files[0].path }}"
        state: present
      when: slurmrestd_deb.files | length > 0

    - name: Crear el usuario de sistema para slurmrestd
      # Ver el punto 3 del comentario de arriba.
      ansible.builtin.user:
        name: "{{ slurmrestd_user }}"
        group: "{{ slurmrestd_group }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        comment: "Slurm REST daemon"
        # append: false hace que la lista sea EXCLUSIVA. Sin esto, si el usuario
        # quedo antes dentro del grupo slurm, sigue como suplementario y
        # slurmrestd sigue abortando aunque el Group= de la unit ya sea correcto.
        groups: []
        append: false

    - name: Permitir que slurmrestd lea la configuracion de accounting
      # /etc/slurm/slurm.conf es 644 pero /etc/slurm/slurmdbd.conf es 600
      # slurm:slurm, y sin lectura el plugin OpenAPI de slurmdbd falla con
      # "Failure loading plugin path bindings". Se usa ACL para no abrir el
      # archivo a todo el mundo como haria un chmod 644.
      ansible.builtin.file:
        path: /etc/slurm/slurmdbd.conf
        state: present
        mode: "0600"
        acl:
          - user: "{{ slurmrestd_user }}"
            rw: false
            r: true
      failed_when: false

    - name: Crear el directorio del drop-in de systemd
      ansible.builtin.file:
        path: /etc/systemd/system/slurmrestd.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Corregir la unit de systemd de slurmrestd
      # El paquete deja la unit sin User=, sin RuntimeDirectory y con un
      # ExecStart generico. Se sobrescribe entero. RuntimeDirectory hace systemd
      # que cree /run/slurmrestd en cada arranque y lo borre al parar, que es
      # justamente lo que necesita el socket UNIX (en /run no sobrevive al reboot).
      #
      # SLURM_JWT= (vacio) es lo importante: la unit del paquete trae
      #   Environment=SLURM_JWT=daemon
      #   Environment=SLURMRESTD_LISTEN=:6820
      # Con SLURM_JWT=daemon slurmrestd autentica sus llamadas HACIA slurmctld
      # con auth/jwt, y slurmctld responde
      #   error: auth_g_unpack: authentication plugin auth/jwt(102) not found
      # y el endpoint /slurm/v0.0.42/nodes devuelve 511
      # "Protocol authentication error". Al parecer solo el demonio slurmrestd
      # trae el plugin auth/jwt; slurmctld no. Vaciando la variable slurmrestd
      # vuelve a munge, que es lo que ambos soportan.
      ansible.builtin.copy:
        dest: /etc/systemd/system/slurmrestd.service.d/override.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          User={{ slurmrestd_user }}
          Group={{ slurmrestd_group }}
          Environment=SLURMRESTD_OPTIONS=
          UnsetEnvironment=SLURM_JWT SLURMRESTD_LISTEN
          RuntimeDirectory=slurmrestd
          RuntimeDirectoryMode=0755
          ExecStart=
          ExecStart=/usr/sbin/slurmrestd -f /etc/slurm/slurm.conf unix:/run/slurmrestd/restd.sock
      notify: Reiniciar slurmrestd

    - name: Aplicar los handlers antes de verificar
      # Imprescindible: el reinicio de slurmrestd llega por notify, y los
      # handlers se ejecutan al FINAL del play. Sin este flush, la tarea de
      # espera del socket y la de la API correrian contra el proceso VIEJO
      # todavia con la configuracion anterior, y fallarian con datos
      # desactualizados (511 Protocol authentication error) aunque el play
      # terminara bien. Ademas, si el play fallara antes, el servicio
      # quedaria sin reiniciar y el next run arrancaria con un config fantasma.
      ansible.builtin.meta: flush_handlers

    - name: Recargar systemd para el drop-in de slurmrestd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Habilitar y arrancar slurmrestd
      ansible.builtin.systemd:
        name: slurmrestd
        enabled: true
        state: started

    - name: Comprobar que slurmrestd arranco con el usuario sin privilegios
      # slurmrestd se niega a correr como root o como el SlurmUser; si el
      # drop-in se perdiera, esto falla al arrancar y no de forma confusa
      # mas adelante.
      ansible.builtin.command:
        argv:
          - pgrep
          - -u
          - "{{ slurmrestd_user }}"
          - -x
          - slurmrestd
      changed_when: false

    - name: Comprobar que slurm_JWT quedo fuera del entorno
      # Si SLURM_JWT este presente (incluso vacio) slurmrestd usa auth/jwt
      # contra slurmctld y todos los endpoints devuelven 511. Falla ruidoso
      # en el playbook en vez de dejar un Grafana vacio.
      ansible.builtin.command:
        argv:
          - bash
          - -c
          - >-
            set -euo pipefail;
            pid=$(pgrep -u {{ slurmrestd_user }} -x slurmrestd | head -1);
            if tr '\0' '\n' < /proc/$pid/environ | grep -q '^SLURM_JWT='; then
              echo 'SLURM_JWT sigue presente en el entorno de slurmrestd' >&2;
              exit 1;
            fi
      changed_when: false

    - name: Esperar a que aparezca el socket de slurmrestd
      ansible.builtin.wait_for:
        path: "{{ slurmrestd_socket }}"
        state: present
        delay: 1
        timeout: 60

    - name: Verificar que la API REST de slurmrestd responde
      # Con socket UNIX la autenticacion la resuelve rest_auth/local sola, asi
      # que no hacen falta credenciales. Si esto falla, el exporter no va a
      # tener datos y hay que saberlo en el playbook, no en el panel de Grafana.
      ansible.builtin.uri:
        url: "http://localhost/slurm/{{ slurm_api_version }}/nodes"
        unix_socket: "{{ slurmrestd_socket }}"
        method: GET
        status_code: [200]
      register: slurmrestd_nodes
      retries: 3
      delay: 3
      until: slurmrestd_nodes.status | default(0) == 200

    - name: Desplegar el exporter de Slurm para Prometheus
      ansible.builtin.copy:
        src: files/prometheus/slurm_exporter.py
        dest: /usr/local/bin/slurm_exporter.py
        owner: root
        group: root
        mode: '0755'

    - name: Crear el directorio de textfile de node_exporter
      ansible.builtin.file:
        path: "{{ node_exporter_textfile_dir }}"
        state: directory
        owner: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        mode: '0755'

    - name: Crear el timer del exporter de Slurm
      # El exporter corre cada 30s con systemd en vez de cron para que no quede
      # una entrada crontab suelta que nadie encuentra después.
      ansible.builtin.copy:
        dest: /etc/systemd/system/slurm-exporter.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Exporta metricas de Slurm a Prometheus via slurmrestd
          After=slurmrestd.service
          Requires=slurmrestd.service

          [Service]
          Type=oneshot
          Environment=SLURMRESTD_SOCKET={{ slurmrestd_socket }}
          Environment=SLURM_METRICS_OUT={{ node_exporter_textfile_dir }}/slurm.prom
          Environment=SLURM_API_VERSION={{ slurm_api_version }}
          ExecStart=/usr/local/bin/slurm_exporter.py
      notify: Reiniciar slurm-exporter timer

    - name: Crear el timer del exporter de Slurm
      ansible.builtin.copy:
        dest: /etc/systemd/system/slurm-exporter.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Ejecuta el exporter de Slurm cada 30 segundos

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=30s
          AccuracySec=5s
          Unit=slurm-exporter.service

          [Install]
          WantedBy=timers.target
      notify: Reiniciar slurm-exporter timer

    - name: Ejecutar el exporter de Slurm una vez
      # Con changed_when: false para que la primera corrida no grite. Si el
      # exporter falla aca, el problema se ve en el playbook y no en Grafana.
      ansible.builtin.command: /usr/local/bin/slurm_exporter.py
      environment:
        SLURMRESTD_SOCKET: "{{ slurmrestd_socket }}"
        SLURM_METRICS_OUT: "{{ node_exporter_textfile_dir }}/slurm.prom"
        SLURM_API_VERSION: "{{ slurm_api_version }}"
      register: slurm_exporter_run
      changed_when: false
      failed_when: slurm_exporter_run.rc != 0

    - name: Habilitar el timer del exporter de Slurm
      ansible.builtin.systemd:
        name: slurm-exporter.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    # Los handlers NO se heredan entre plays, asi que cada uno va en el play de
    # la tarea que lo notifica.
    - name: Reiniciar slurmrestd
      ansible.builtin.systemd:
        name: slurmrestd
        state: restarted
        daemon_reload: true

    - name: Reiniciar slurm-exporter timer
      ansible.builtin.systemd:
        name: slurm-exporter.timer
        state: restarted
        daemon_reload: true

# ----------------------------------------------------------------------------
# 4. Almacenamiento Compartido NFS (/shared y /home)
# ----------------------------------------------------------------------------
- name: "4. Almacenamiento Compartido NFS: Servidor y Clientes"
  hosts: compute:ondemand:master
  become: true
  tags: [nfs]
  tasks:
    - name: Determinar si este host es el servidor NFS físico
      ansible.builtin.set_fact:
        is_nfs_server: "{{ inventory_hostname in groups['master'] or (ansible_host | default(inventory_hostname)) == (hostvars[groups['master'][0]]['ansible_host'] | default(groups['master'][0])) }}"

    - name: Configurar estructura en el Master NFS
      when: is_nfs_server
      block:
        - name: Instalar servidor NFS en Master
          ansible.builtin.apt:
            name: nfs-kernel-server
            state: present

        - name: Asegurar directorio /shared colaborativo
          ansible.builtin.file:
            path: "{{ slurm_shared_dir }}"
            state: directory
            owner: root
            group: "{{ home_group }}"
            mode: '2775'

        - name: Asegurar raiz de homes compartidos con setgid
          # El bit setgid hace que cada home creado dentro herede el grupo, que
          # es lo que permite que un home nuevo sea accesible sin cambiar el
          # grupo a mano. Sin el, el home queda con el grupo primario del root.
          ansible.builtin.file:
            path: "{{ shared_home_root }}"
            state: directory
            owner: root
            group: "{{ home_group }}"
            mode: '{{ home_root_mode }}'

        - name: Eliminar montajes NFS locales residuales de fstab en el Master
          # El master es el servidor de estos exports: si los monta sobre si
          # mismo, un reboot lo deja trabado esperando al propio servidor.
          ansible.posix.mount:
            path: "{{ item }}"
            state: unmounted
          loop:
            - "{{ slurm_shared_dir }}"
            - "{{ shared_home_root }}"

        - name: Configurar /etc/exports
          # Se escribe el archivo COMPLETO (no blockinfile) y se restringe con
          # nfs_export_networks. Antes se publicaba con '*', que dejaba /shared
          # y /home exportados a toda la red. /home deja de exportarse: es el
          # home local del master y montarlo sobre los nodos tapa /home/work2.
          ansible.builtin.copy:
            dest: /etc/exports
            owner: root
            group: root
            mode: '0644'
            content: |
              {{ slurm_shared_dir }} {{ nfs_export_networks }}(rw,sync,no_subtree_check)
              {{ shared_home_root }} {{ nfs_export_networks }}(rw,sync,no_subtree_check)

        - name: Vaciar tabla de exportaciones del kernel
          # exportfs -ra SOLO agrega entradas: las cargadas a mano con
          # 'exportfs -o ...' siguen vivas en la tabla del kernel y quedan
          # duplicadas frente a /etc/exports, lo que hace fallar -ra con
          # 'duplicated export entries'. Hay que drenar la tabla primero.
          #
          # Se usa -ua en vez de una por entrada porque una entrada duplicada
          # con opciones distintas (el /export/home manual tinha no_root_squash
          # y el de /etc/exports no) hace que exportfs se niegue a
          # desexportarla: la deja '[IGNORED]' y -ra vuelve a fallar igual.
          ansible.builtin.command: exportfs -ua
          register: exportfs_ua
          changed_when: "'unexporting' in exportfs_ua.stderr"

        - name: Reexportar desde /etc/exports
          ansible.builtin.command: exportfs -ra
          register: exportfs_ra
          changed_when: false
          failed_when:
            - exportfs_ra.rc != 0
            - "'duplicated export entries' not in exportfs_ra.stderr"

        - name: Iniciar y habilitar servidor NFS
          ansible.builtin.systemd:
            name: nfs-kernel-server
            state: started
            enabled: true

    - name: Configurar clientes NFS remotos
      when: not is_nfs_server
      block:
        - name: Instalar cliente NFS
          ansible.builtin.apt:
            name: nfs-common
            state: present

        - name: Crear directorios de montaje
          # Sin mode: con root_squash el mkdir remoteo como nobody no puede
          # dejar el directorio en 0755.
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
          loop:
            - "{{ slurm_shared_dir }}"
            - "{{ shared_home_root }}"

        - name: Quitar /home del fstab
          ansible.posix.mount:
            path: /home
            state: absent

        - name: Desmontar /home del Master de forma diferida
          # /home del Master no se puede desmontar con 'umount' normal porque el
          # home de este mismo usuario (work2) vive en el montaje: la sesión de
          # SSH que está ejecutando Ansible lo tiene tomado y el umount falla
          # con 'device is busy'.
          # El desmontaje diferido (lazy) lo desengancha en el acto y solo deja
          # de resolver nombres de archivos nuevos. Es lo que permite crear
          # abajo el home local y dejar /home sin NFS de una vez.
          ansible.builtin.command: umount -l /home
          register: lazy_unmount_home
          changed_when: lazy_unmount_home.rc == 0
          failed_when:
            - lazy_unmount_home.rc != 0
            - "'not mounted' not in lazy_unmount_home.stderr"
            - "'no mount point specified' not in lazy_unmount_home.stderr"

        - name: Asegurar home local de los usuarios del nodo
          # Va DESPUES del desmontaje y antes de volver a montar nada: si el
          # home local no existiera, el usuario del nodo quedaria sin poder
          # hacer login, porque /home/work2 venia del NFS del master.
          #
          # La lista sale de getent en el HOST, no de ansible_facts: el fact
          # getent_passwd no se recolecta en la corrida y por eso el loop
          # sobre ansible_facts.getent_passwd fallaba con 'no such attribute'.
          # El filtro shell || true evita que una home duplicada en otra
          # entrada del mismo nombre corte el play.
          ansible.builtin.shell: |
            set -o pipefail
            getent passwd | while IFS=: read -r pw_name _pw uid gid gecos pw_dir shell; do
              case "$pw_dir" in
                /home/*) ;;
                *) continue ;;
              esac
              case "$pw_name" in
                root|nobody|*_*|"") continue ;;
              esac
              [ "$shell" = "/bin/bash" ] || [ "$shell" = "/bin/sh" ] || continue
              install -d -m 0750 -o "$pw_name" -g "$pw_name" "$pw_dir"
            done
          args:
            executable: /bin/bash
          changed_when: false

        - name: Montar y persistir {{ slurm_shared_dir }}
          ansible.posix.mount:
            src: "{{ hostvars[groups['master'][0]]['ansible_host'] | default(groups['master'][0]) }}:{{ slurm_shared_dir }}"
            path: "{{ slurm_shared_dir }}"
            fstype: nfs
            opts: "{{ nfs_shared_opts }}"
            state: mounted

        - name: Montar y persistir {{ shared_home_root }}
          ansible.posix.mount:
            src: "{{ hostvars[groups['master'][0]]['ansible_host'] | default(groups['master'][0]) }}:{{ shared_home_root }}"
            path: "{{ shared_home_root }}"
            fstype: nfs
            opts: "{{ nfs_home_opts }}"
            state: mounted

# ----------------------------------------------------------------------------
# 5. Nodos de Cómputo (slurmd) y Detección GRES
# ----------------------------------------------------------------------------
- name: "5. Aprovisionar nodos de cómputo (slurmd)"
  hosts: compute
  become: true
  tasks:
    - name: Detectar aceleradoras GPU en el worker
      ansible.builtin.shell: |
        VENDOR=none
        COUNT=0
        if command -v nvidia-smi >/dev/null 2>&1; then
          N=$(nvidia-smi --query-gpu=count --format=csv,noheader 2>/dev/null | head -n 1 | tr -d '[:space:]')
          if [ "${N:-0}" -gt 0 ] 2>/dev/null; then COUNT=$N; VENDOR=nvidia; fi
        fi
        if [ "$VENDOR" = "none" ] && command -v rocm-smi >/dev/null 2>&1; then
          N=$(rocm-smi --showid 2>/dev/null | grep -c '^GPU' || true)
          if [ "${N:-0}" -gt 0 ] 2>/dev/null; then COUNT=$N; VENDOR=amd; fi
        fi
        if [ "$VENDOR" = "none" ] && ls /dev/nvidia[0-9]* >/dev/null 2>&1; then
          N=$(ls /dev/nvidia[0-9]* 2>/dev/null | grep -c 'nvidia[0-9]' || true)
          if [ "${N:-0}" -gt 0 ] 2>/dev/null; then COUNT=$N; VENDOR=nvidia; fi
        fi
        if [ "$VENDOR" = "none" ] && command -v lspci >/dev/null 2>&1; then
          if lspci -nn 2>/dev/null | grep -Ei '\[10de:' | grep -qiE 'VGA|3D controller|Display'; then
            N=$(lspci -nn 2>/dev/null | grep -Ei '\[10de:' | grep -ciE 'VGA|3D controller|Display' || true)
            if [ "${N:-0}" -gt 0 ] 2>/dev/null; then COUNT=$N; VENDOR=nvidia; fi
          fi
        fi
        echo "vendor=${VENDOR} count=${COUNT}"
      register: gpu_detection
      changed_when: false

    - name: Registrar facts de GPU
      ansible.builtin.set_fact:
        detected_gpus: "{{ (gpu_detection.stdout | regex_search('count=([0-9]+)') | default('count=0') | replace('count=', '')) | int }}"
        gpu_vendor: "{{ gpu_detection.stdout | regex_search('vendor=([a-z]+)') | default('vendor=none') | replace('vendor=', '') }}"

    - name: Asegurar directorio temporal para deb de slurmd
      ansible.builtin.file:
        path: /tmp/slurm_debs
        state: directory
        mode: '0755'

    - name: Copiar paquete slurmd desde packages/ubuntu26/
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /tmp/slurm_debs/
        mode: '0644'
      with_fileglob:
        - "packages/ubuntu26/slurm-smd-slurmd_*.deb"

    - name: Instalar paquete slurmd
      ansible.builtin.shell: >
        DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::="--force-confnew" install
        /tmp/slurm_debs/slurm-smd-slurmd_*.deb
      register: apt_slurmd
      changed_when: "'Setting up' in apt_slurmd.stdout"

    # --- Aplicaciones Interactivas para Open OnDemand ---
    - name: Instalar Jupyter Notebook y dependencias de Python
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
          - jupyter
          - jupyter-notebook
        state: present

    - name: Crear venv de JupyterLab en el nodo de cómputo
      # El paquete de Ubuntu "jupyter" trae jupyter_core + notebook 6 pero NO
      # jupyterlab, asi que "jupyter lab" fallaba con
      # "Jupyter command `jupyter-lab` not found." y la sesion moria al arrancar.
      # Se usa un venv en vez de pip --break-system-packages porque el Python del
      # sistema es externally-managed (PEP 668) y el install por pip chocaba con
      # typing_extensions de Debian ("no RECORD file was found").
      ansible.builtin.command: python3 -m venv /opt/jupyter
      args:
        creates: /opt/jupyter/bin/jupyter
      tags: [interactive]

    - name: Instalar JupyterLab en el venv
      ansible.builtin.pip:
        name:
          - jupyterlab
          - ipykernel
        virtualenv: /opt/jupyter
        virtualenv_command: /usr/bin/python3 -m venv
      register: ood_jupyterlab_install
      retries: 2
      delay: 5
      until: ood_jupyterlab_install is succeeded
      tags: [interactive]

    - name: Verificar que JupyterLab quede disponible
      # "jupyter lab --version" imprime solo el numero de version. El caso que
      # hay que atrapar es el que nos mordio: sin jupyterlab el subcomando no
      # existe y responde "Jupyter command `jupyter-lab` not found.", que sale
      # con codigo 0 en esta forma. Por eso se valida el FORMATO de la salida y
      # no solo el return code.
      ansible.builtin.command: /opt/jupyter/bin/jupyter lab --version
      register: ood_jupyterlab_check
      changed_when: false
      failed_when: ood_jupyterlab_check.stdout is not match('^\d+\.\d+')
      tags: [interactive]

    - name: Instalar VS Code (code-server)
      ansible.builtin.shell: curl -fsSL https://code-server.dev/install.sh | sh
      args:
        creates: /usr/bin/code-server
      tags: [interactive]
    # ----------------------------------------------------

    - name: Directorios de slurmd
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: '0755'
      loop:
        - /etc/slurm
        - /var/log/slurm
        - /run/slurm
        - /var/spool/slurmd

    - name: Desplegar cgroup.conf (cgroup v2)
      ansible.builtin.copy:
        dest: /etc/slurm/cgroup.conf
        content: |
          CgroupPlugin=cgroup/v2
          ConstrainCores=yes
          ConstrainRAMSpace=yes
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: '0644'
      notify: Reiniciar slurmd

    - name: Desplegar gres.conf si hay GPUs
      ansible.builtin.template:
        src: templates/gres.conf.j2
        dest: /etc/slurm/gres.conf
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: '0644'
      when: detected_gpus | int > 0
      notify: Reiniciar slurmd

    - name: Desplegar slurm.conf unificado en el worker
      ansible.builtin.template:
        src: templates/slurm.conf.j2
        dest: /etc/slurm/slurm.conf
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: '0644'
      notify: Reiniciar slurmd

    - name: Iniciar y habilitar slurmd
      ansible.builtin.systemd:
        name: slurmd
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Reiniciar slurmd
      ansible.builtin.systemd:
        name: slurmd
        state: restarted

# ----------------------------------------------------------------------------
# 6. Apptainer en Master y Workers
# ----------------------------------------------------------------------------
- name: "6. Instalar y configurar Apptainer"
  hosts: master,compute
  become: true
  tasks:
    - name: Asegurar directorio para keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Descargar llave GPG del PPA de Apptainer
      ansible.builtin.get_url:
        url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search={{ apptainer_launchpad_key }}"
        dest: /etc/apt/keyrings/apptainer.asc
        mode: '0644'

    - name: Agregar repositorio PPA de Apptainer
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/apptainer.asc] https://ppa.launchpadcontent.net/apptainer/ppa/ubuntu {{ ansible_distribution_release }} main"
        state: present
        filename: apptainer-ppa
        update_cache: true

    - name: Instalar Apptainer
      ansible.builtin.apt:
        name:
          - apptainer
          - apptainer-suid
        state: present

    - name: Montar automáticamente /shared y /home dentro de los contenedores
      ansible.builtin.lineinfile:
        path: /etc/apptainer/apptainer.conf
        regexp: "^bind path = {{ item }}"
        line: "bind path = {{ item }}"
        state: present
      loop:
        - "{{ slurm_shared_dir }}"
        - /home

# ----------------------------------------------------------------------------
# 7. Reconciliación Final de Slurmctld
# ----------------------------------------------------------------------------
- name: "7. Reconciliación final en Master"
  hosts: master
  become: true
  tasks:
    - name: Actualizar slurm.conf definitivo con las GPUs detectadas en todos los workers
      ansible.builtin.template:
        src: templates/slurm.conf.j2
        dest: /etc/slurm/slurm.conf
        owner: "{{ slurm_user }}"
        group: "{{ slurm_group }}"
        mode: '0644'

    - name: Reconfigurar slurmctld en caliente
      ansible.builtin.command: scontrol reconfigure
      changed_when: true

    - name: Esperar 3 segundos para sincronización de daemons
      ansible.builtin.pause:
        seconds: 3

    - name: Limpiar posibles estados DRAIN y reanudar nodos
      ansible.builtin.shell: 'scontrol update nodename={{ hostvars[item]["ansible_facts"]["hostname"] | default(item) }} state=RESUME reason=""'
      loop: "{{ groups['compute'] }}"
      changed_when: false
      failed_when: false

# ----------------------------------------------------------------------------
# 8. Open OnDemand en Ubuntu 26.04 (Apache2 + TLS + Slurm + LDAP)
# ----------------------------------------------------------------------------
- name: "8. Aprovisionar Open OnDemand con HTTPS, Slurm Client y LDAP"
  hosts: ondemand
  become: true
  tags: [ood]
  tasks:
    - name: Configurar kernel para permitir FIFOs de Passenger en /tmp
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-passenger-fifos.conf
        reload: true
      loop:
        - { name: 'fs.protected_fifos', value: '0' }
        - { name: 'fs.protected_regular', value: '0' }

    - name: Instalar dependencias previas para el repositorio
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
        state: present

    - name: Descargar paquete de release de Open OnDemand 4.2 para Ubuntu 26 (Resolute)
      ansible.builtin.get_url:
        url: "https://apt.osc.edu/ondemand/4.2/ondemand-release-web_4.2.0-resolute_all.deb"
        dest: /tmp/ondemand-release-web_4.2.0-resolute_all.deb
        mode: '0644'

    - name: Instalar configuración oficial del repositorio OOD
      ansible.builtin.apt:
        deb: /tmp/ondemand-release-web_4.2.0-resolute_all.deb
        state: present

    - name: Instalar OOD, Apache y dependencias de criptografía
      ansible.builtin.apt:
        name:
          - ondemand
          - apache2
          - libapache2-mod-authnz-pam
          - python3-cryptography
          - ssl-cert
        state: present
        update_cache: true

    # --- Configuración Cliente Slurm para OOD ---
    - name: Asegurar directorio /etc/slurm en nodo Open OnDemand
      ansible.builtin.file:
        path: /etc/slurm
        state: directory
        owner: "{{ slurm_user | default('slurm') }}"
        group: "{{ slurm_group | default('slurm') }}"
        mode: '0755'

    - name: Desplegar slurm.conf idéntico en nodo Open OnDemand
      ansible.builtin.template:
        src: templates/slurm.conf.j2
        dest: /etc/slurm/slurm.conf
        owner: "{{ slurm_user | default('slurm') }}"
        group: "{{ slurm_group | default('slurm') }}"
        mode: '0644'

    - name: Asegurar directorio clusters.d en OOD
      ansible.builtin.file:
        path: /etc/ood/config/clusters.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Declarar clúster Slurm en OOD vinculando binario sbatch oficial
      ansible.builtin.copy:
        dest: "/etc/ood/config/clusters.d/{{ slurm_cluster_name }}.yml"
        owner: root
        group: root
        mode: '0644'
        content: |
          v2:
            metadata:
              title: "{{ slurm_cluster_name }}"
            login:
              host: "{{ hostvars[groups['master'][0]]['ansible_host'] | default(groups['master'][0]) }}"
            job:
              adapter: "slurm"
              bin: "/usr/bin"
              conf: "/etc/slurm/slurm.conf"

    # --- Generación de Certificados TLS Autofirmados ---
    - name: Generar clave privada RSA para Open OnDemand
      community.crypto.openssl_privatekey:
        path: "{{ ood_ssl_key_path }}"
        size: 2048
        type: RSA
        owner: root
        group: ssl-cert
        mode: '0640'

    - name: Generar CSR con SAN (FQDN e IP)
      community.crypto.openssl_csr:
        path: "/tmp/ood.csr"
        privatekey_path: "{{ ood_ssl_key_path }}"
        common_name: "{{ ood_server_name }}"
        subject_alt_name:
          - "DNS:{{ ood_server_name }}"
          - "DNS:{{ inventory_hostname }}"
          - "IP:{{ ansible_host | default(inventory_hostname) }}"
        owner: root
        group: root
        mode: '0644'

    - name: Generar certificado autofirmado X.509
      community.crypto.x509_certificate:
        path: "{{ ood_ssl_cert_path }}"
        csr_path: "/tmp/ood.csr"
        privatekey_path: "{{ ood_ssl_key_path }}"
        provider: selfsigned
        selfsigned_not_after: "+365d"
        owner: root
        group: root
        mode: '0644'

    # --- Configuración de Apache y Módulos ---
    - name: Habilitar authnz_ldap
      # Módulo que IMPLEMENTA AuthBasicProvider ldap. Si falta, Apache no
      # arranca con 'AH00526 Invalid command AuthBasicProvider'. Se habilita
      # aparte de la lista de abajo para que el error sea atribuible.
      community.general.apache2_module:
        name: authnz_ldap
        state: present
      notify: Reiniciar apache

    - name: Habilitar módulos necesarios de Apache
      community.general.apache2_module:
        name: "{{ item }}"
        state: present
      loop:
        - ldap
        - ssl
        - rewrite
        - proxy
        - proxy_http
        - proxy_wstunnel
        - headers
      notify: Reiniciar apache

    - name: Deshabilitar VirtualHost default de Ubuntu
      ansible.builtin.command: a2dissite 000-default
      args:
        removes: /etc/apache2/sites-enabled/000-default.conf
      notify: Reiniciar apache

    - name: Sudoers para nginx_stage (PUN)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ood
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
        content: |
          www-data ALL=(ALL) NOPASSWD: /opt/ood/nginx_stage/sbin/nginx_stage

    - name: Desplegar script wrapper para creación segura de Home
      ansible.builtin.template:
        src: templates/ood_create_home.sh.j2
        dest: /usr/local/sbin/ood_create_home
        owner: root
        group: root
        mode: '0755'

    - name: Crear y reparar el Home de cada usuario OOD
      # El pre-hook de nginx_stage NO es configurable por YAML: la opcion existe
      # solo como flag '-P/--pre-hook-root' del subcomando 'pun', y
      # Configuration#read_configuration descarta cualquier clave del YAML que no
      # sea un instance_variable suyo (solo avisa "invalid configuration option"
      # por stderr y sigue). Por eso el home se garantiza desde Ansible.
      #
      # El mismo wrapper se sigue usando porque ya valida el home del getent,
      # rechaza paths no absolutos y repara ~/ondemand de forma idempotente.
      ansible.builtin.command: "/usr/local/sbin/ood_create_home --user {{ item }}"
      loop: "{{ [ldap_test_user, ldap_second_user] | reject('none') | reject('undefined') | list }}"
      when: item is defined and item | length > 0
      register: ood_create_home_result
      changed_when: "'CHANGED' in ood_create_home_result.stdout"

    - name: Reparar el propietario de /var/tmp de cada usuario OOD
      # /var/tmp/<user> guarda la cache de la PUN y los archivos de sesion.
      # OOD los crea con el UID que el usuario tenia en ese momento; si despues se
      # corrige el uidNumber en LDAP quedan como el UID viejo y el PUN los abre en
      # solo lectura. Es el mismo motivo por el que el home quedaba con el
      # propietario equivocado.
      #
      # Se usa chown -R y NO el modulo file: OOD crea subdirectorios de cache con
      # permisos 755 y archivos de sesion dentro, asi que arreglar solo el dir
      # padre deja los archivos viejos sin escribir y el error persiste.
      ansible.builtin.command: >
        chown -R {{ item }}:{{ home_group }} /var/tmp/{{ item }}
      loop: "{{ [ldap_test_user, ldap_second_user] | reject('none') | reject('undefined') | list }}"
      when: item is defined and item | length > 0
      changed_when: false

    - name: Inicializar la base SQLite de My Jobs si esta vacia
      # My Jobs guarda todo en ~/ondemand/data/sys/myjobs/production.sqlite3, que
      # vive DENTRO del home NFS y por eso la crea el propio OOD con el UID del
      # momento. Si quedo a medio crear (4096 bytes, cero tablas) el portal
      # revienta con "Could not find table 'jobs'" en /pun/sys/myjobs y no se
      # arregla solito. rake db:migrate crea el schema.
      #
      # Solo corre si la tabla 'jobs' NO existe, asi que es idempotente de verdad.
      # El GEM_PATH tiene que incluir las rutas del sistema: el Gemfile.lock de
      # myjobs fija net-pop/net-smtp/webrick que NO estan en /opt/ood/gems, solo en
      # /usr/lib/ruby/gems y /usr/share/rubygems-integration. Sin esas rutas
      # bundler aborta con Bundler::GemNotFound antes de migrar nada.
      # SECRET_KEY_BASE es obligatorio en production y solo se usa para esto: las
      # migraciones no lo necesitan como valor real.
      #
      # IMPORTANTE: corre como el usuario, no como root.
      # SQLite abre/crea los archivos -journal y -wal con el UID de quien
      # escribe. Con rake en root la base quedaba utilizable pero cualquier
      # escritura posterior del PUN caia en
      # "SQLite3::ReadOnlyException: attempt to write a readonly database",
      # que es el mismo fallo que traia el home con el UID viejo.
      #
      # La ruta usa $HOME en lugar de ood_user_data_root porque el home real de
      # OOD lleva el subdirectorio 'ondemand' adelante. Con
      # "{{ ood_user_data_root }}/{{ item }}/data/..." el test [ -f ] no
      # encontraba nada y la tarea era codigo muerto: nunca habia migrado nada.
      ansible.builtin.shell: |
        set -euo pipefail
        db="{{ shared_home_root }}/{{ item }}/ondemand/data/sys/myjobs/production.sqlite3"
        if [ ! -f "$db" ]; then
          echo "SKIP el usuario todavia no abrio My Jobs: $db"
          exit 0
        fi
        # El guard usa python3 y NO ruby: el ruby del sistema no tiene la gema
        # sqlite3 y aborta con "cannot load such file -- sqlite3 (LoadError)",
        # con lo cual el test NUNCA evaluaba la base y caia siempre al else. El
        # modulo sqlite3 viene en la stdlib de python3.
        if python3 -c 'import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); sys.exit(0 if c.execute("SELECT count(*) FROM sqlite_master WHERE type=? AND name=?", ["table","jobs"]).fetchone()[0] > 0 else 1)' "$db"; then
          echo "OK ya migrada: $db"
        else
          # db:migrate:reset, NO db:migrate.
          #
          # El fallo real: cuando la base queda a medio crear, schema_migrations
          # ya tiene las 17 migraciones aplicadas pero falta la tabla 'jobs'.
          # db:migrate mira schema_migrations, ve que todo esta al dia y no hace
          # NADA: sale 0, imprime "MIGRADA" y la base sigue rota. Para
          # "migraciones marcadas pero tablas ausentes" hay que reconstruir.
          #
          # Es destructivo (drop + recreate) y por eso solo entra en esta rama
          # cuando la tabla 'jobs' no existe, o sea cuando la base ya es
          # inservible. Se pierde el historial de jobs, que en una base rota no
          # es consultable de todos modos.
          #
          # rake corre con su y NO como root: SQLite crea los -journal y -wal con
          # el UID de quien escribe; si la migracion corre como root la base
          # queda utilizable pero cualquier escritura posterior del PUN cae en
          # "SQLite3::ReadOnlyException: attempt to write a readonly database".
          #
          # Se baja de privilegios con su en vez de become_user porque el
          # mecanismo de become_user de Ansible hace un "chmod A+..." sobre su
          # archivo temporal y este chmod lo rechaza con
          # "invalid operator (expected +, -, or =, but found A)".
          #
          # DATABASE_PATH es obligatorio: database.yml resuelve la ruta con
          # ENV["DATABASE_PATH"] || dataroot, y sin el env el rake puede migrar
          # otra base que no es la que usa el PUN.
          #
          # DISABLE_DATABASE_ENVIRONMENT_CHECK: Rails bloquea las acciones
          # destructivas sobre 'production' con
          # ActiveRecord::ProtectedEnvironmentError.
          su -s /bin/bash "{{ item }}" -c "cd {{ ood_apps_root }}/sys/myjobs && \
            DATABASE_PATH=$db \
            DISABLE_DATABASE_ENVIRONMENT_CHECK=1 \
            RAILS_ENV=production \
            SECRET_KEY_BASE={{ ood_migration_secret_key }} \
            GEM_HOME=/opt/ood/gems \
            GEM_PATH=/opt/ood/gems:/usr/lib/ruby/gems/3.3.0:/usr/share/rubygems-integration/all:/var/lib/gems/3.3.0 \
            PATH=/opt/ood/gems/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
            rake db:migrate:reset"
          # Cinturon por si el su no hubiera dropado bien el UID.
          chown -R "{{ item }}:{{ home_group }}" "$(dirname "$db")"
          # Verificacion postcondicion: si no quedo la tabla, no se da por buena.
          python3 -c 'import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); sys.exit(0 if c.execute("SELECT count(*) FROM sqlite_master WHERE type=? AND name=?", ["table","jobs"]).fetchone()[0] > 0 else 1)' "$db" \
            || { echo "FALLO: la tabla jobs sigue sin existir en $db"; exit 1; }
          echo "MIGRADA: $db"
        fi
      args:
        executable: /bin/bash
      loop: "{{ [ldap_test_user, ldap_second_user] | reject('none') | reject('undefined') | list }}"
      when: item is defined and item | length > 0
      register: ood_myjobs_migrate
      changed_when: "'MIGRADA:' in ood_myjobs_migrate.stdout"

    - name: Configurar nginx_stage sin opciones invalidas
      # CRITICO: no se define ningun pre-hook aca porque NO existe como opcion de
      # configuracion. En pun_config_generator.rb el hook se declara con
      # add_option :pre_hook_root_cmd, que solo genera un attr_reader (opcion de
      # CLI: '-P, --pre-hook-root=ROOT_HOOK' del subcomando 'pun'). No existe el
      # attr_writer ni el instance_variable en NginxStage::Configuration, asi que
      # read_configuration lo rechaza con "Warning: invalid configuration
      # option" en stderr y el hook NUNCA se ejecuta.
      #
      # El archivo se deja solo con comentarios para que quede documentado el
      # motivo y nginx_stage use sus defaults.
      ansible.builtin.copy:
        dest: /etc/ood/config/nginx_stage.yml
        owner: root
        group: root
        mode: '0644'
        content: |
          # Sin opciones: el home lo crea y repara Ansible antes de levantar el PUN.
          # Ver la tarea "Crear y reparar el Home de cada usuario OOD".

    - name: Verificar que nginx_stage acepta la configuracion sin warnings
      # Cualquier clave no reconocida se descarta en silencio (solo un warning por
      # stderr), asi que un hook mal escrito pasa inadvertido. Este control falla
      # si aparece 'invalid configuration option'.
      ansible.builtin.command: /opt/ood/nginx_stage/sbin/nginx_stage --help
      register: ood_nginx_stage_check
      changed_when: false
      failed_when: "'invalid configuration option' in ood_nginx_stage_check.stderr"

    # --- Apps web de OOD que no se instalan -----------------------------
    # Dos apps del paquete ondemand quedan FUERA a proposito:
    #
    #   sys/shell  (ood-shell v1.1.2, role: shell, Node + node-pty)
    #     Con Passenger 6.1.2 el spawn del proceso Node muere con un fatal de
    #     V8, no con un error de modulo nativo:
    #       Fatal error in , line 0
    #       Check failed: 12 == (*__errno_location ())   # 12 = ENOMEM
    #       v8::base::OS::SetPermissions(...)
    #       v8::internal::Compiler::GenerateBaselineCode # JIT
    #     Se descarto que fuera la version de Node: con Node 22 del sistema y
    #     con un Node LTS 20.20.2 propio en /opt el fallo es IDENTICO, y la
    #     misma app con el mismo Node corre 45s cuando se ejecuta a mano
    #     (Error IDs: 335307dd, 31351df5, ec282460, f1c15bde).
    #     Se descartaron tambien OOM killer, rlimits, cgroups, AppArmor,
    #     monturas noexec y el propio node-pty.
    #     La terminal del cluster la reemplaza la app sys/desktop (Xvnc+xterm
    #     via noVNC), que no depende de Node.
    #
    #   sys/bc_desktop (role: batch_connect, template vnc de ood_core)
    #     Ese template fue escrito para TurboVNC. Con TigerVNC 1.15 falla en
    #     cuatro puntos verificados: 'vncserver -log' -> "Unrecognized option:
    #     -Log"; espera 'pgrep -s 0 Xvnc' (el daemon sale de la sesion 0 y el
    #     binario se llama Xtigervnc); y saca el display con awk '/^Desktop/'
    #     cuando TigerVNC imprime "for display :N". Ademas invoca
    #     'module purge' y arranca gnome/kde/mate, que no existen en el nodo.
    #     sys/desktop cubre el mismo caso con template "basic" y codigo propio.
    #
    # Se borran del arbol de apps, no solo se ocultan: si quedan, OOD las
    # ofrece en el portal y el usuario las abre y vuelve a fallar.
    - name: Eliminar apps web de OOD incompatibles con este cluster
      ansible.builtin.file:
        path: "{{ ood_apps_root }}/sys/{{ item }}"
        state: absent
      loop:
        - shell
        - bc_desktop

    - name: Eliminar el Node LTS de la app Shell (ya no se usa)
      # Queda el arbol /opt/ood/node-20.20.2 de los despliegues anteriores.
      # No se borra /usr/bin/node: es el Node del sistema y lo usan otras apps.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ ood_shell_node_prefix }}"
        - "/tmp/node-v{{ ood_shell_node_version }}-linux-x64.tar.xz"
      when: ood_shell_node_prefix is defined

    # --- Pila VNC en los NODOS DE COMPUTO ------------------------------
    # La PUN (este host) solo proxea: el Xvnc, el websockify y el cliente
    # noVNC corren DENTRO del job, o sea en los nodos de compute. Por eso el
    # paquete se instala en 'compute' y no en 'ondemand' (arriba solo va el
    # web root de noVNC, que se sirve desde este host).
    #
    # matchbox-window-manager + xterm dan una sesion grafica minima: sin
    # escritorio completo (gnome/kde/mate) que serian cientos de MB por nodo.
    # El objetivo es una terminal dentro del navegador, no un escritorio.
    - name: Instalar la pila VNC y un escritorio minimo en los nodos de compute
      # NO se puede delegate_to aca: 'ondemand' no incluye a los compute, asi
      # que el delegate no encuentra el host y el play aborta. La pila VNC de
      # los nodos se instala en su propio play mas abajo, con hosts: compute.
      ansible.builtin.debug:
        msg: "La pila VNC de compute se instala en el play 'VNC en nodos de computo'."
      changed_when: false

    # --- Pila VNC para las apps de escritorio remoto -------------------
    # El template batch_connect "vnc" de ood_core (el que usa bc_desktop)
    # necesita tres cosas que NO vienen con el paquete ondemand:
    #   1) vncserver/Xvnc  -> levanta el display X
    #   2) websockify       -> puente TCP<->WebSocket
    #   3) noVNC            -> cliente web que abre la sesion en el navegador
    # Sin esto la app se queda en "Starting" y nunca muestra el boton.
    - name: Instalar noVNC y websockify en la PUN
      # noVNC es el cliente web (se sirve como estatico) y websockify hace de
      # puente. El servidor VNC real corre en el nodo de compute.
      ansible.builtin.apt:
        name:
          - novnc
          - websockify
        state: present
        update_cache: true

    - name: Crear el directorio del wrapper websockify
      # El template vnc.rb llama SIEMPRE a la ruta absoluta /opt/websockify/run
      # (default de :websockify_cmd) y espera en el log la linea
      # "proxying from :<puerto>". Un wrapper propio es lo que hace que el
      # waiting del after_script termine en vez de agotar el timeout.
      ansible.builtin.file:
        path: /opt/websockify
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Desplegar el wrapper websockify con el web root de noVNC
      # El paquete websockify de Ubuntu instala /usr/bin/websockify, pero SIN
      # --web: sin ese flag no sirve el cliente noVNC y el navegador no tiene
      # que cargar. Se pasa --web para que el mismo puerto sirva la sesion.
      ansible.builtin.copy:
        dest: /opt/websockify/run
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          # Generado por Ansible: NO editar a mano.
          # Contrato con ood_core/batch_connect/templates/vnc.rb:
          #   /opt/websockify/run <puerto_ws> localhost:<puerto_vnc>
          exec /usr/bin/websockify --web /usr/share/novnc "$@"

    - name: Verificar que el wrapper websockify levanta el puente
      # El template vnc.rb hace polling del log buscando 'proxying from', asi
      # que se prueba la cadena real: wrapper -> websockify -> novnc web root.
      # websockify sigue escuchando en background esperando una conexion real,
      # asi que la tarea tiene que cortarlo: 'timeout 3' mata el wrapper y
      # devuelve el codigo 124, que no se mira porque el veredicto sale del
      # stdout, no del exit status.
      ansible.builtin.shell: |
        timeout 3 /opt/websockify/run 19998 localhost:5900 2>&1 || true
      register: ood_websockify_check
      changed_when: false
      failed_when: "'proxying from' not in ood_websockify_check.stdout"

    # --- Configuración de ood_portal.yml ---
    - name: Configurar ood_portal.yml con HTTPS y LDAP
      ansible.builtin.copy:
        dest: /etc/ood/config/ood_portal.yml
        owner: root
        group: root
        mode: '0640'
        content: |
          servername: "{{ ood_server_name }}"
          port: 443
          # Reverse proxy de OOD hacia los servidores web de los nodos de
          # cómputo. Viene DESHABILITADO por defecto en OOD 4: sin esto las apps
          # interactivas no tienen a dónde apuntar y sus botones "Connect"
          # fallan siempre. Son claves de primer nivel.
          host_regex: '{{ ood_proxy_host_regex }}'
          node_uri: '/node'
          rnode_uri: '/rnode'
          # listen / ssl / auth van en el mismo nivel que servername: la
          # estructura 'portal:' anidada hace que update_ood_portal reporte
          # "'auth' section in ood_portal.yml is still missing" y genere un
          # vhost minimo que manda todo a need_auth.html.
          listen:
            - 80
            - 443
          ssl:
            - 'SSLCertificateFile "{{ ood_ssl_cert_path }}"'
            - 'SSLCertificateKeyFile "{{ ood_ssl_key_path }}"'
          auth:
            - 'AuthType Basic'
            - 'AuthName "Cluster HPC UTN - Acceso Seguro"'
            - 'AuthBasicProvider ldap'
            - 'AuthLDAPURL "ldap://{{ ldap_server_ip }}/{{ ldap_user_search_base }}?uid?sub?(objectClass=posixAccount)"'
            - 'AuthLDAPBindDN "{{ ldap_default_bind_dn }}"'
            - 'AuthLDAPBindPassword "{{ ldap_default_authtok }}"'
            - 'Require valid-user'
      register: ood_portal_cfg

    - name: Registrar el resultado del vhost generado para poder verificarlo
      # update_ood_portal se ejecuta siempre (ver tarea siguiente) pero el
      # vhost SOLO se regenera cuando ood_portal.yml cambia. La condición queda
      # acá para poder decidir el notify a Apache.
      ansible.builtin.set_fact:
        ood_portal_needs_reload: "{{ ood_portal_cfg.changed }}"

    - name: Compilar VirtualHost de Apache con update_ood_portal
      # update_ood_portal regenera el vhost desde cero en cada corrida, asi que
      # el cambio real se mide comparando el contenido: antes estaba en
      # 'changed_when: true' (siempre changed) y eso hacia que Apache se
      # reiniciara en cada deploy aunque no hubiera nada que cambiar.
      ansible.builtin.shell: |
        set -o pipefail
        VHOST=/etc/apache2/sites-available/ood-portal.conf
        BEFORE=$(mktemp); AFTER=$(mktemp)
        [ -f "$VHOST" ] && cp "$VHOST" "$BEFORE" || : > "$BEFORE"
        /opt/ood/ood-portal-generator/sbin/update_ood_portal --force
        cp "$VHOST" "$AFTER"
        if cmp -s "$BEFORE" "$AFTER"; then
          rm -f "$BEFORE" "$AFTER"
          exit 0
        fi
        echo "VHOST_CHANGED"
        rm -f "$BEFORE" "$AFTER"
      register: ood_vhost_build
      changed_when: "'VHOST_CHANGED' in ood_vhost_build.stdout"

    - name: Verificar que el vhost generado tenga el proxy /node y /rnode
      # update_ood_portal devuelve 0 igual cuando no encuentra auth: en ese
      # caso escribe un vhost minimo que redirige todo a need_auth.html, sin
      # Location /pun y sin los proxy, y el portal queda inutilizable pero sin
      # ningun error visible. Conviene fallar acá y no al usar el portal.
      ansible.builtin.shell: |
        set -o pipefail
        VHOST=/etc/apache2/sites-available/ood-portal.conf
        test -s "$VHOST" || { echo "vhost vacio o inexistente: $VHOST"; exit 1; }
        grep -q 'AuthBasicProvider' "$VHOST" || {
          echo "el vhost no tiene AuthBasicProvider: update_ood_portal no proceso la config de autenticacion"
          exit 1
        }
        # El proxy se genera como un regex de Location con %{MATCH_HOST} /
        # %{MATCH_PORT} capturados, no como un 'Location /node' literal.
        grep -qE 'MATCH_HOST.*MATCH_PORT' "$VHOST" || {
          echo "el vhost no tiene el proxy /node ni /rnode (falta node_uri/rnode_uri o host_regex)"
          exit 1
        }
        # El grupo (?<host>...) no puede traer anchors ^ $: OOD embebe host_regex
        # dentro de su propio patron, y un ^ interior exige la posicion 0 del
        # subject (ya consumida por "/node/"), asi que la regex no matchea nunca
        # y /node y /rnode devuelven 404 aunque el vhost parezca correcto.
        if grep -qE '\(\?<host>[^)]*[\^$]' "$VHOST"; then
          echo "host_regex tiene anchors ^ o \$ dentro del grupo (?<host>...):"
          echo "el LocationMatch nunca matchea y /node y /rnode devuelven 404."
          grep -oE '\(\?<host>[^)]*\)' "$VHOST" | head -2
          exit 1
        fi
      args:
        executable: /bin/bash
      register: ood_vhost_check
      changed_when: false

    - name: Recargar Apache si el vhost cambio
      ansible.builtin.systemd:
        name: apache2
        state: reloaded
      when: ood_portal_needs_reload | bool

    - name: Asegurar servicio Apache activo y habilitado
      ansible.builtin.systemd:
        name: apache2
        state: started
        enabled: true

  handlers:
    - name: Reiniciar apache
      ansible.builtin.systemd:
        name: apache2
        state: restarted

# ============================================================================
# 9. Aprovisionar Monitoreo (Prometheus + Grafana)
# ============================================================================
- name: "9. Instalar Prometheus y Grafana para Monitoreo de Slurm"
  hosts: master
  become: true
  tags: [grafana]
  tasks:
    - name: Habilitar el textfile collector de node_exporter
      # Sin esto node_exporter ignora por completo /var/lib/node_exporter y el
      # .prom que escribe el exporter de Slurm no aparece en /metrics. El
      # paquete de Ubuntu deja ARGS="" en /etc/default/prometheus-node-exporter.
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: '^ARGS='
        line: 'ARGS="{{ node_exporter_args }}"'
        mode: '0644'
      notify: Reiniciar node-exporter

    - name: Instalar paquetes básicos de monitoreo
      ansible.builtin.apt:
        name:
          - prometheus
          - prometheus-node-exporter
          - apt-transport-https
          - software-properties-common
          - wget
        state: present
        update_cache: true

    - name: Importar clave GPG de Grafana
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: '0644'

    - name: Añadir repositorio de Grafana
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        state: present
        update_cache: true

    - name: Instalar Grafana
      ansible.builtin.apt:
        name: grafana
        state: present

    - name: Iniciar y habilitar Prometheus y Grafana
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - prometheus
        - grafana-server

    - name: Vincular Grafana solo a loopback
      # Con http_addr en 0.0.0.0 el puerto queda abierto a toda la LAN y
      # esquiva por completo la autenticación de OOD. El único acceso
      # público pasa por el proxy de Apache de la tarea siguiente.
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: server
        option: http_addr
        value: "127.0.0.1"
      notify: Reiniciar grafana

    - name: Fijar el puerto de Grafana
      # NO puede ser 3000: la app shell de OOD 4.2.4 lo tiene hardcodeado y
      # Passenger no le pasa PORT. Ver la nota de grafana_port en group_vars.
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: server
        option: http_port
        value: "{{ grafana_port }}"
      notify: Reiniciar grafana

    - name: Configurar Grafana para servir bajo el subpath del portal
      # Sin esto, con el proxy montado en {{ grafana_sub_path }}, Grafana
      # genera redirecciones y assets apuntando a la raíz del dominio.
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: server
        option: root_url
        value: "https://{{ ood_server_name }}{{ grafana_sub_path }}"
      notify: Reiniciar grafana

    - name: Activar serve_from_sub_path en Grafana
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: server
        option: serve_from_sub_path
        value: "true"
      notify: Reiniciar grafana

    - name: Permitir incrustación (embedding) de Grafana
      # Necesario para los paneles embebidos en ActiveJobs. El acceso anónimo
      # solo es alcanzable desde loopback (ver http_addr), no desde la LAN.
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: security
        option: allow_embedding
        value: "true"
      notify: Reiniciar grafana

    # --- Autenticacion: UNA sola capa, la de Apache -------------------
    # El acceso anonimo de Grafana esta DESHABILITADO a proposito.
    #
    # Con las dos capas activas (Apache Basic contra LDAP + login propio de
    # Grafana) el usuario ve el dialogo nativo de Apache, despues el login de
    # Grafana, y si se equivoca una vez Grafana responde
    #   "too many consecutive incorrect login attempts for user - login for
    #    user temporarily blocked"
    # y lo deja afuera hasta que expire el bloqueo. Eso es lo que pasaba.
    #
    # Ademas el anon de Grafana es un identity sobre el que NO se puede
    # auditar quien miro que: el log queda como "id=anonymous:0".
    #
    # Con auth.proxy, Grafana no tiene login propio: le cree al usuario que le
    # pasa Apache en la cabecera X-WEBAUTH-USER (que sale de REMOTE_USER, ya
    # validado contra LDAP por mod_auth_ldap). Queda un unico login, el del
    # portal, y Grafana puede atribuir cada vista a un usuario real.
    - name: Deshabilitar el acceso anónimo de Grafana
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: auth.anonymous
        option: enabled
        value: "false"
      notify: Reiniciar grafana

    - name: Confiar en la identidad que valida Apache (auth.proxy)
      # El nombre de la cabecera lo define Grafana; Apache tiene que mandated
      # exactamente el mismo (ver RequestHeader set en el vhost de Grafana).
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: auth.proxy
        option: enabled
        value: "true"
      notify: Reiniciar grafana

    - name: Declarar la cabecera de identidad que envía Apache
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: auth.proxy
        option: header_name
        value: "X-WEBAUTH-USER"
      notify: Reiniciar grafana

    - name: Ocultar el formulario de login de Grafana
      # Ya no hay login que hacer: el portal es el unico que autentica.
      # Con esto el usuario nunca ve una pantalla de login de Grafana.
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: auth
        option: disable_login_form
        value: "true"
      notify: Reiniciar grafana

    - name: Asignar automáticamente a los usuarios del proxy a la org principal
      # Sin esto, el primer ingreso de cada usuario falla con
      # "user is not assigned to an organization" y Grafana lo rebota.
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: users
        option: auto_assign_org
        value: "true"
      notify: Reiniciar grafana

    - name: Rol por defecto de los usuarios del proxy
      # Viewer: este Grafana es de monitoreo, nadie deberia editar dashboards
      # desde el portal.
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: users
        option: auto_assign_org_role
        value: "Viewer"
      notify: Reiniciar grafana

    - name: Provisionar datasource Prometheus en Grafana
      # Sin esto Grafana abre vacio: se puede loguear pero no hay ninguna fuente
      # de datos, asi que no aparece ningun panel ni metricas.
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: root
        mode: '0644'
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              access: proxy
              # Grafana corre nativo en este host (no en un contenedor), asi que
              # Prometheus es alcanzable por loopback.
              url: http://127.0.0.1:9090
              isDefault: true
              editable: false
              jsonData:
                timeInterval: 30s

    - name: Provisionar dashboards de Grafana
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/slurm.yml
        owner: root
        group: root
        mode: '0644'
        content: |
          apiVersion: 1
          providers:
            - name: utn
              orgId: 1
              folder: "UTN"
              type: file
              disableDeletion: false
              updateIntervalSeconds: 30
              allowUiUpdates: true
              options:
                path: /var/lib/grafana/dashboards

    - name: Crear directorio de dashboards de Grafana
      ansible.builtin.file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: '0755'

    - name: Desplegar dashboard del clúster
      ansible.builtin.copy:
        src: files/grafana/dashboards/slurm-cluster.json
        dest: /var/lib/grafana/dashboards/slurm-cluster.json
        owner: grafana
        group: grafana
        mode: '0644'
      notify: Reiniciar grafana

    - name: Publicar Grafana detrás del portal con Apache
      # Va en un conf aparte y NO dentro del vhost que genera
      # update_ood_portal: ese archivo se regenera en cada corrida y
      # borraría cualquier edición manual. <Location> se fusiona globalmente,
      # así que aplica al vhost del portal sin tocarlo.
      # Se repite el bloque de autenticación porque el del vhost solo cubre
      # /pun: sin esto, /grafana quedaría abierto para cualquiera que llegue
      # al puerto 443.
      ansible.builtin.copy:
        dest: /etc/apache2/conf-available/ood-grafana.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          ProxyPreserveHost On

          # El path va en el ProxyPass de nivel server, NO dentro de <Location>:
          # Apache rechaza con "ProxyPass|ProxyPassMatch can not have a path when
          # defined in a location" y se queda sin arrancar. Y el path destino
          # tiene que INCLUIR el subpath, porque Grafana corre con
          # serve_from_sub_path=true: si se lo sacamos, Grafana devuelve 301 hacia
          # /grafana/ en loop infinito.
          ProxyPass        "{{ grafana_sub_path }}" "http://127.0.0.1:{{ grafana_port }}{{ grafana_sub_path }}"
          ProxyPassReverse "{{ grafana_sub_path }}" "http://127.0.0.1:{{ grafana_port }}{{ grafana_sub_path }}"

          # Solo la autenticacion va en <Location>. El bloque se repite porque el
          # del vhost generado por update_ood_portal cubre unicamente /pun: sin
          # esto, /grafana quedaria abierto a cualquiera que llegue al 443.
          <Location "{{ grafana_sub_path }}">
            AuthType Basic
            AuthName "Cluster HPC UTN - Acceso Seguro"
            AuthBasicProvider ldap
            AuthLDAPURL "ldap://{{ ldap_server_ip }}/{{ ldap_user_search_base }}?uid?sub?(objectClass=posixAccount)"
            AuthLDAPBindDN "{{ ldap_default_bind_dn }}"
            AuthLDAPBindPassword "{{ ldap_default_authtok }}"
            Require valid-user

            # --- Identidad para Grafana (auth.proxy) -------------------
            # Lo que sigue es lo que hace que haya UN solo login: Apache valida
            # contra LDAP y le pasa el usuario a Grafana por esta cabecera, que
            # es la que declara 'auth.proxy.header_name' en grafana.ini.
            #
            # IMPORTANTE: la sintaxis tiene que ser 'expr=%{REMOTE_USER}'.
            # La forma con el environment de Apache
            #     RequestHeader set X-WEBAUTH-USER "%{REMOTE_USER}e" env=REMOTE_USER
            # NO funciona: el guard 'env=' no se satisface para REMOTE_USER y
            # Apache acepta la config con 'Syntax OK' pero NO setea la cabecera
            # (verificado con un backend que devuelve las cabeceras como
            # cuerpo: 'HDR=None' con la forma vieja, 'HDR=alumno1' con expr=).
            # El sintoma de ese fallo es silencioso y confuso: Apache autentica
            # bien (302), pero Grafana no recibe identidad, cae en
            # '401 Invalid username or password' y redirige a /grafana/login,
            # o sea aparece el login de Grafana y el browser vuelve a pedir
            # credenciales.
            #
            # El 'unset' va PRIMERO y es obligatorio: sin el, un cliente podría
            # mandar su propia X-WEBAUTH-USER y hacerse pasar por otro usuario.
            # Con 'set' despues, Apache la sobreescribe siempre con el valor
            # real de REMOTE_USER.
            RequestHeader unset X-WEBAUTH-USER
            RequestHeader set X-WEBAUTH-USER "expr=%{REMOTE_USER}"
          </Location>
      notify: Reiniciar apache

    - name: Habilitar el conf de Grafana en Apache
      # apache2_module no maneja conf.d: es para modulos (mods-enabled), y
      # a2enconf no es idempotente desde Ansible: con 'removes' imprime
      # "already enabled" pero igual lo marca changed; con 'creates' se saltea
      # y stdout queda vacio, asi que cualquier changed_when sobre el stdout lo
      # marca changed tambien. El symlink directo es lo que hace a2enconf y
      # ademas es idempotente de verdad.
      ansible.builtin.file:
        src: /etc/apache2/conf-available/ood-grafana.conf
        dest: /etc/apache2/conf-enabled/ood-grafana.conf
        state: link
      notify: Reiniciar apache

    - name: Crear directorio para la App de Grafana
      ansible.builtin.file:
        path: "{{ ood_apps_root }}/sys/grafana"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Crear manifiesto de Grafana como App de Enlace
      # 'category' es lo que hace que la app aparezca en el menú lateral de
      # navegación del portal: no hace falta un nav.yml aparte.
      ansible.builtin.copy:
        dest: "{{ ood_apps_root }}/sys/grafana/manifest.yml"
        owner: root
        group: root
        mode: '0644'
        content: |
          ---
          name: Monitor en Tiempo Real (Grafana)
          description: Dashboard de métricas de Slurm
          icon: fa://bar-chart
          url: "{{ grafana_sub_path }}"
          category: Jobs

  handlers:
    - name: Reiniciar node-exporter
      # La tarea que habilita el textfile collector esta en ESTE play, asi que
      # el handler tiene que estar aca y no en el del master.
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted

    - name: Reiniciar grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
    - name: Reiniciar apache
      ansible.builtin.systemd:
        name: apache2
        state: restarted

# ============================================================================
# 10. Instalar Aplicaciones Interactivas en OOD (Jupyter y VS Code)
# ============================================================================
- name: "10. Instalar Aplicaciones Interactivas (Jupyter y VS Code)"
  hosts: ondemand
  become: true
  tags: [interactive]
  tasks:
    - name: Eliminar clones de apps de terceros
      # bc_osc_* Assuming hardcodean clusters de OSC (ascend/cardinal/pitzer),
      # la particion 'batch' y un arbol de modulos Lmod que este cluster no
      # tiene. Se borran y se reemplazan por apps propias del repo: un
      # 'git clone' sin version fija contra 'master' hace que cada corrida
      # cambie el comportamiento sin que cambie el playbook.
      #
      # La lista NO puede incluir jupyter/codeserver: esas son las apps propias
      # que se despliegan dos tareas mas abajo. Si aparecen aca, cada corrida las
      # borra y las vuelve a crear y el play nunca es idempotente.
      ansible.builtin.file:
        path: "{{ ood_apps_root }}/sys/{{ item }}"
        state: absent
      loop: "{{ ood_third_party_apps_to_remove | default([]) }}"

    - name: Crear estructura de las apps interactivas
      ansible.builtin.file:
        path: "{{ ood_apps_root }}/sys/{{ item }}/template"
        state: directory
        owner: root
        group: root
        mode: '0755'
      # La lista sale de ood_interactive_apps (group_vars/all.yml) para que
      # agregar una app no requiera tocar dos lugares: si se agrega al listado
      # de archivos pero no al de directorios, el deploy falla con
      # "Destination directory ... does not exist".
      loop: "{{ ood_interactive_apps | map(attribute='app') | unique | list }}"

    - name: Desplegar archivos de las apps interactivas
      # Los .j2 se renderizan con Ansible y el sufijo se les quita: el nombre
      # final es manifest.yml, template/script.sh.erb, etc. (lo que despues
      # renderiza OOD con ERB).
      ansible.builtin.template:
        src: "files/ood/apps/sys/{{ item.app }}/{{ item.src }}"
        dest: "{{ ood_apps_root }}/sys/{{ item.app }}/{{ item.dest }}"
        owner: root
        group: root
        # mode por item: template/script.sh.erb tiene que quedar ejecutable
        # (0755) porque el job_script_content.sh de OOD lo invoca como
        # "<workdir>/script.sh" &. El resto son archivos que OOD sourcea o
        # lee, y 0644 alcanza. Ver ood_interactive_apps en group_vars/all.yml.
        mode: "{{ item.mode | default('0644') }}"
      loop: "{{ ood_interactive_apps }}"
      loop_control:
        label: "{{ item.app }}/{{ item.dest }}"
      notify: Reiniciar apache

  handlers:
    - name: Reiniciar apache
      ansible.builtin.systemd:
        name: apache2
        state: restarted

# ============================================================================
# 11. Pila VNC en los nodos de computo (para la app Desktop de OOD)
# ============================================================================
# Es un play aparte y NO una tarea delegate_to del play 8 a proposito:
# delegar a 'compute' desde un play que corre en 'ondemand' rompe el include
# de hosts y aborta el play.
#
# La app Desktop usa el template batch_connect "vnc" de ood_core, que dentro
# del job de Slurm necesita:
#   vncserver / Xvnc   -> el display X
#   xterm              -> la terminal que se ve en el navegador
#   matchbox           -> gestor de ventanas minimo, para que xterm se vea
# Sin esto la sesion queda en "Starting" eterno: el vnc.rb no encuentra
# 'vncserver', llama clean_up 1 y nunca genera connection.yml.
#
# Es un escritorio minimo a proposito, no gnome/kde/mate: el objetivo es una
# terminal dentro del navegador y un DE completo son cientos de MB por nodo.
- name: "11. Instalar la pila VNC en los nodos de computo"
  hosts: compute
  become: true
  tags: [vnc, compute]
  tasks:
    - name: Instalar el servidor VNC, xterm y el gestor de ventanas
      ansible.builtin.apt:
        name:
          - tigervnc-standalone-server
          - xterm
          - matchbox-window-manager
          # websockify va en el nodo, no en la PUN: el puente TCP<->WebSocket
          # corre dentro del job de Slurm. El cliente noVNC lo sirve el
          # dashboard de OOD (public/noVNC-1.3.0).
          - websockify
        state: present
        update_cache: true

    - name: Verificar que los binarios de la sesion grafica quedaron disponibles
      # Control explicito y por nombre: si un paquete cambia de layout, el
      # assert falla aca con un mensaje claro en vez de dejar sesiones
      # colgadas en Starting.
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/bin/Xvnc
        - /usr/bin/vncpasswd
        - /usr/bin/websockify
        - /usr/bin/xterm
        - /usr/bin/matchbox-window-manager
      register: ood_vnc_binaries

    - name: Fallar si falta algun binario de la sesion grafica
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          {{ item.item }} no existe: la app Terminal Web no va a poder
          levantar la sesion y todas las sesiones quedan en Starting.
        success_msg: "{{ item.item }} disponible."
      loop: "{{ ood_vnc_binaries.results }}"
      loop_control:
        label: "{{ item.item }}"
      changed_when: false
