# --- DEFINICIÓN DE NODOS ÚNICOS CON ALIAS ---
[master]
slurmmaster ansible_host=192.168.18.185 ansible_user=master

[database]
slurmdb ansible_host=192.168.18.185 ansible_user=master

[ondemand]
slurmod ansible_host=192.168.18.185 ansible_user=master

[ldap_server]
slurmldap ansible_host=192.168.18.185 ansible_user=master

[compute]
worker1 ansible_host=192.168.18.175 ansible_user=work node_feature=standperf
worker2 ansible_host=192.168.18.177 ansible_user=work2 node_feature=highperf

# --- GRUPOS PARA TUS PLAYBOOKS ---
[slurm_cluster:children]
master
database
compute

# --- CONFIGURACIÓN GLOBAL DE CONEXIÓN ---
[all:vars]
ansible_become=true
ansible_become_method=sudo
# 💡 ESTA ES LA CLAVE: Evita colisiones de SSH en la misma máquina física
ansible_ssh_common_args='-o ControlMaster=auto -o ControlPersist=60s'

