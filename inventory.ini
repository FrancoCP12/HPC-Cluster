# --- DEFINICIÓN DE NODOS ÚNICOS CON ALIAS ---
[master]
slurmmaster ansible_host=192.168.18.195 ansible_user=masterf

[database]
slurmdb ansible_host=192.168.18.195 ansible_user=masterf

[ondemand]
slurmod ansible_host=192.168.18.196 ansible_user=oodf

[ldap_server]
slurmldap ansible_host=192.168.18.195 ansible_user=masterf

[compute]
worker1 ansible_host=192.168.18.194 ansible_user=workf node_feature=standperf
#worker2 ansible_host=192.168.18.177 ansible_user=work2 node_feature=highperf

# --- GRUPOS PARA TUS PLAYBOOKS ---
[slurm_cluster:children]
master
database
compute

# --- CONFIGURACIÓN GLOBAL DE CONEXIÓN ---
[all:vars]
ansible_become=true
ansible_become_method=sudo
ansible_ssh_common_args='-o ControlMaster=auto -o ControlPersist=60s'

