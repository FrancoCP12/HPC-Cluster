# --- DEFINICIÓN DE NODOS ÚNICOS CON ALIAS ---
[master]
slurmmaster ansible_host=100.104.11.61 ansible_user=node00

[database]
slurmdb ansible_host=100.104.11.61 ansible_user=node00

[ondemand]
slurmod ansible_host=100.105.64.16 ansible_user=node01

[ldap_server]
slurmldap ansible_host=100.104.11.61 ansible_user=node00

[compute]
worker1 ansible_host=100.125.236.56 ansible_user=node02 node_feature=standperf
#worker2 ansible_host=192.168.18.177 ansible_user=work2 node_feature=highperf

# --- GRUPOS PARA TUS PLAYBOOKS ---
[slurm_cluster:children]
master
database
compute

# --- CONFIGURACIÓN GLOBAL DE CONEXIÓN ---
[all:vars]
ansible_become=true
ansible_become_method=sudo
ansible_ssh_common_args='-o ControlMaster=auto -o ControlPersist=60s'
# En Ubuntu 24.04+ NO existe /usr/bin/python (solo python3). Sin esto, Ansible
# adivina "/usr/bin/python" y el ping falla con rc=127 (command not found).
ansible_python_interpreter=/usr/bin/python3

