---
# ============================================================================
# Variables globales del clúster Slurm — group_vars/all.yml
# ----------------------------------------------------------------------------
# CERO hardcoding: el playbook no contiene secretos ni nombres embebidos.
# Todo se consume desde aquí con fallbacks seguros.
#
# SECRETOS ⚠️  Cero hardcoding: usa Ansible Vault (--ask-vault-pass o ANSIBLE_VAULT_PASSWORD_FILE).
# Usa Ansible Vault:
#   ansible-vault encrypt_string 'Tu-Super-Clave-123' --name slurm_db_password
#   ansible-playbook --ask-vault-pass playbook.yml
# ============================================================================

# ----- Identidad del clúster -----
slurm_cluster_name: clusterUTN          # SlurmClusterName (DBD + slurm.conf + sacctmgr)
slurm_version: "24.11.7"                # Versión de los paquetes .deb desplegados

# ----- Usuario / grupo del servicio -----
slurm_user: slurm
slurm_group: slurm
slurm_uid: 1100
slurm_gid: 1100

# ----- Base de datos contable (MySQL / SlurmDBD) -----
# Host/IP derivados automáticamente del primer miembro del grupo [database].
slurm_db_host: "{{ hostvars[groups['database'][0]]['ansible_hostname'] | default(groups['database'][0]) }}"
slurm_db_ip: "{{ hostvars[groups['database'][0]]['ansible_host'] | default(hostvars[groups['database'][0]]['ansible_default_ipv4']['address']) }}"
slurm_db_user: slurm
slurm_db_password: "SlurmDB2026!"
slurm_db_name: slurm_acct_db
slurm_db_port: 3306
# slurmdbd exige estos dos valores para accounting; sin ellos avisa
# "Database settings not recommended values" y con carga real el registro de
# eventos se traba. El buffer pool se calcula sobre la RAM del host [database],
# no del actual, para que siga siendo valido si la base se mueve de topologia.
mysql_innodb_buffer_pool_mb: "{{ ((hostvars[groups['database'][0]]['ansible_memtotal_mb'] | default(2048)) * 0.25) | int }}"
mysql_innodb_lock_wait_timeout: 3600
slurmdbd_port: 6819                     # Puerto del demonio SlurmDBD
# slurmrestd NO puede correr como root, como SlurmUser ni con el grupo de
# SlurmUser: aborta con "should not be run as the root user", "should not be run
# as SlurmUser" y "should not be run with SlurmUser's group". Por eso tiene
# usuario y grupo propios.
slurmrestd_user: slurmrestd
slurmrestd_group: slurmrestd
# Se usa socket UNIX y no TCP: los unicos plugins de auth de este build son
# rest_auth/local y rest_auth/jwt (no hay auth/basic), asi que por TCP habria
# que emitir JWT. Ademas slurmrestd queda sin abrir ningun puerto de red.
slurmrestd_socket: /run/slurmrestd/restd.sock
# La API de Slurm 24.11 es versionada: /slurm/v0.0.42/... y no /slurm/v1/...
slurm_api_version: v0.0.42
node_exporter_user: prometheus
node_exporter_group: prometheus
node_exporter_textfile_dir: /var/lib/node_exporter
node_exporter_args: "--collector.textfile.directory={{ node_exporter_textfile_dir }}"

prometheus_port: 9090
node_exporter_port: 9100

# Prometheus queda en el master porque es el que scrapea al node_exporter y al
# textfile collector con las metricas de Slurm. Grafana se instala en el nodo OOD
# para quedar junto al Apache del portal, asi que el datasource tiene que
# alcanzarlo por red en vez de por loopback.
prometheus_host: "{{ hostvars[groups['master'][0]]['ansible_host'] | default(hostvars[groups['master'][0]]['ansible_default_ipv4']['address'] | default('127.0.0.1')) }}"

# ----- Almacenamiento compartido (NFS) -----
slurm_shared_dir: /shared

# Raíz del home compartido. Es el directorio que el master EXPORTA por NFS, pero
# que los clientes NO montan: cada nodo lo sirve localmente desde su propio
# disco y se lo entrega a SSSD vía homeDirectory en LDAP. Ver el play 4.
#
# Por qué no se monta /home por NFS: sshd corre como sshd_t y SELinux (Enforcing
# en Rocky) le NEGA la lectura de authorized_keys con contexto nfs_t. El
# playbook se auto-bloqueaba el acceso SSH a los nodos.
#
# Esta ruta SÍ se monta por NFS, pero con la opción de montaje context= que la
# etiqueta como user_home_t. Ese es el contexto que sshd necesita para leer el
# authorized_keys del usuario, así que el home queda realmente compartido
# (un archivo escrito en un nodo se ve desde todos los demás) sin romper SSH.
shared_home_root: /export/home

# Redes autorizadas a montar las exportaciones NFS del master. Restringir el
# export a la red del clúster evita exponer los homes compartidos a cualquier
# host de la LAN.
nfs_export_networks: "192.168.18.0/24"

# Clientes autorizados a gestionar los homes SIN squash. El nodo Open OnDemand
# necesitaprivilegios root reales sobre el share: nginx_stage corre
# ood_create_home desde exec_pre_hook como root y ese script hace install -d,
# chown y chmod por cada usuario. Con root_squash el root remoto se mapea a
# nobody y todo eso falla con EPERM ("chmod failed with error Operation not
# permitted"), dejando los homes sin dueno correcto.
#
# El squash se levanta SOLO para el home y SOLO para el nodo OOD: /shared y el
# resto de la red siguen con root_squash. Si OOD corre en el propio master se
# filtra, porque ahi el root es local y no hay nada que chmodear a traves de NFS.
nfs_home_admin_clients: >-
  {{ (groups['ondemand'] | default([]) | map('extract', hostvars, 'ansible_host') | list)
     | difference([hostvars[groups['master'][0]]['ansible_host'] | default(''), '']) }}

# ----- Contenedores (Apptainer) -----
apptainer_bind_mount: /shared           # Bind path automático en contenedores
apptainer_launchpad_key: "0xF6B0F5193D4F3301EF491FF0AFE36534FC6218AE"

# ----- Ajustes de instalación / APT -----
apt_lock_wait_timeout: 300              # Espera activa sobre locks dpkg/apt (segundos)
# Paquetes runtime dependencias del .deb de Slurm (SchedMD para Ubuntu/Debian)
slurm_runtime_packages:
  - chrony
  - munge
  - libmunge2
  - libhwloc15
  - libjwt2
  - libyaml-0-2
  - libpmix2t64
  - liblz4-1
  - libhdf5-310
  - libhdf5-hl-310
  - liblua5.3-0
  - libmysqlclient24
  - libfreeipmi17
  - libipmimonitoring6
  - libhttp-parser2.9
  - librdkafka1

# Patrón de recurso local de paquetes Slurm (sin versión hardcodeada)
slurm_packages_dir: packages
slurm_deb_patterns:
  - "slurm-smd_*.deb"

#LDAP 

ldap_domain: "utn.edu.ar"
ldap_search_base: "dc=utn,dc=edu,dc=ar"
ldap_user_search_base: "ou=People,dc=utn,dc=edu,dc=ar"
ldap_group_search_base: "ou=Groups,dc=utn,dc=edu,dc=ar"

# Resuelve la IP del host asignado a ldap_server dinámicamente
ldap_server_ip: "{{ hostvars[groups['ldap_server'][0]]['ansible_host'] | default(groups['ldap_server'][0]) }}"
ldap_uri: "ldaps://{{ ldap_server_ip }}:636"

# Credenciales administrativas
ldap_admin_dn: "cn=admin,dc=utn,dc=edu,dc=ar"
ldap_admin_password: "ClusterAdminPassword2026!"

# Cuenta de lectura para SSSD (Service Account)
ldap_default_bind_dn: "cn=admin,dc=utn,dc=edu,dc=ar"
ldap_default_authtok: "ClusterAdminPassword2026!"
ldap_tls_reqcert: "never"

# Usuario de prueba que se crea en ou=People para validar la autenticacion
# contra Open OnDemand. El playbook NO guarda el hash en el LDIF:
# lo genera con slappasswd en tiempo de ejecucion a partir de este valor, asi
# que el texto claro nunca se escribe en el arbol LDAP.
ldap_test_user: "admin"
ldap_test_user_password: "admin1"
# Deben coincidir con uidNumber/gidNumber del LDIF de arriba.
ldap_test_user_uid: 2004
ldap_test_user_gid: 2000
# homeDirectory del usuario en el árbol LDAP. Apunta al home compartido que
# exporta el master y que todos los nodos montan sobre la misma ruta; SSSD lo
# resuelve y oddjob-mkhomedir lo crea en el primer login si aún no existe.
ldap_test_user_home: "{{ shared_home_root }}/{{ ldap_test_user }}"

# Segundo usuario de prueba. Existe para poder validar el portal con una cuenta
# que NO sea la del administrador, y sobre todo para exercitar la creacion de
# homes. Su uidNumber tiene que ser DISTINTO del de ldap_test_user: cuando dos
# entradas comparten uidNumber, getent devuelve el mismo uid para las dos y el
# home de una queda propiedad de la otra.
ldap_second_user: "alumno1"
ldap_second_user_password: "alumno1"
ldap_second_user_uid: 2002
ldap_second_user_gid: 2000
ldap_second_user_home: "{{ shared_home_root }}/{{ ldap_second_user }}"

# ----- Homes compartidos: grupo y modos -------------------------------------
# home_group debe existir con el mismo gidNumber que el grupo de LDAP
# investigacion (ver el LDIF de ou=Groups), para que los permisos de grupo
# signifiquen lo mismo en el master, en los nodos y en el arbol LDAP.
home_group: investigacion
home_root_mode: "2775"     # padre setgid: los homes heredan el grupo
home_user_mode: "2750"     # home: rw para dueno y grupo, rx para el resto
home_skel_dir: /etc/skel

# ----- Particion Slurm ------------------------------------------------------
# La apps interactivas de OOD tienen que pedir la particion REAL. Apuntar a una
# que no existe hace que sbatch falle al submitsar y el usuario nunca ve el job.
slurm_partition_name: general

# Recursos que piden las apps interactivas (Jupyter / code-server) por defecto.
#
# IMPORTANTE: tienen que entrar en el nodo de calculo. work2 tiene CPUTot=1 y
# RealMemory=1477 MiB, asi que con los valores previos (2 cores / 4096 MiB)
# sbatch enviaba el job y Slurm lo dejaba en PENDING para siempre con
# Reason=PartitionConfig (MinCPUsNode=2 contra un nodo de 1 CPU). El portal
# mostraba "Your session is currently starting..." indefinidamente y al vencer
# la sesion aparecia "this card will be retained for 6 more days": la app nunca
# arrancaba. El maximo tambien se limita para que el usuario no pueda pedir mas
# de lo que existe y volver a caer en la misma espera eternal.
interactive_num_cores_default: 1
interactive_num_cores_max: 1
interactive_memory_default_mb: 1024
interactive_memory_max_mb: 1024

# ----- Open OnDemand --------------------------------------------------------
# Regex de hosts a los que el reverse proxy de OOD puede conectarse. El proxy
# /node/ y /rnode/ esta DESHABILITADO por defecto en OOD 4: sin host_regex /
# node_uri / rnode_uri en ood_portal.yml los botones "Connect" de Jupyter y
# VS Code no tienen a donde apuntar.
#
# El regex se arma SOLO en el play 9 a partir de los ansible_hostname reales de
# los nodos de 'compute', asi que no hay mas que acordarse de actualizarlo al
# agregar un nodo.
#
# Se mantiene ESTRECHA a proposito: host_regex habilita proxy hacia cualquier
# host que coincida, asi que un comodin abierto (p.ej. '[\w.-]+') convierte al
# portal OOD en un proxy abierto de la red interna (SSRF). La lista de nombres
# explicitos es lo que lo mantiene acotado.
#
# Los hostnames NO son los del inventory: OOD proxea al host que Slurm reporta
# (NodeName) y al que devuelve 'hostname' dentro del job. NodeName sale de
# ansible_hostname del nodo (templates/slurm.conf.j2), mientras que el compute
# group del inventory se llama worker1 / worker2. Ejemplo real del deadlock que
# kostaba un deploy por semana: NodeName es 'workf', no 'work' ni 'work2'.
#
# Estuvo en '(work2|worker2)': incluia 'work2' pero NO 'work'. Luego en
# '(work|work2)': seguia sin cubriendo 'workf'. Toda sesion que caia en el
# primer nodo moria con 404 "Not Found" al pulsar el boton, aunque el servidor
# estuviera escuchando. La lista tiene que cubrir TODOS los NodeName de
# compute.
#
# Nombres ADICIONALES a aceptar, para casos donde Slurm reporte un nombre
# distinto al del sistema (alias, FQDN). Lista vacia en la practica.
ood_proxy_host_regex_extra: []

# Grafana se publica como subpath del portal, no en un puerto propio.
grafana_sub_path: /grafana
# OOD 4.2.4 tiene el puerto 3000 HARDCODEADO en la app shell
# (apps/sys/shell/app.js:14 -> const port = 3000). Passenger no le pasa PORT, asi
# que si Grafana escucha en 3000 el shell no arranca y /pun/sys/shell devuelve 500
# con "The application process exited prematurely". Por eso Grafana va al 3001.
grafana_port: 3001

# Raiz de las apps del portal. Las de sistema se despliegan desde files/.
ood_apps_root: /var/www/ood/apps

# Raiz de los datos que OOD guarda DENTRO del home de cada usuario (My Jobs,
# su DB SQLite y la cache del dashboard). OOD la deriva del home del usuario, asi
# que en este cluster queda bajo el NFS compartido.
ood_user_data_root: "{{ shared_home_root }}"

# Rails exige SECRET_KEY_BASE en el entorno production. Solo se usa para correr
# 'rake db:migrate' de My Jobs: las migraciones no necesitan un valor real, asi
# que no se genera ni se guarda ninguna clave real en el repo.
ood_migration_secret_key: "ood-migration-only-not-a-real-secret"

# Archivos de las apps interactivas Batch Connect. El sufijo .j2 se le quita al
# renderizar: template/script.sh.erb.j2 -> template/script.sh.erb.
ood_interactive_apps:
  - app: jupyter
    src: manifest.yml.j2
    dest: manifest.yml
  - app: jupyter
    src: form.yml.j2
    dest: form.yml
  - app: jupyter
    src: submit.yml.erb.j2
    dest: submit.yml.erb
  - app: jupyter
    src: view.html.erb.j2
    dest: view.html.erb
  - app: jupyter
    src: template/before.sh.erb.j2
    dest: template/before.sh.erb
  - app: jupyter
    src: template/script.sh.erb.j2
    dest: template/script.sh.erb
    # 0755 y NO 0644: el job_script_content.sh generado por OOD hace
    #   "<workdir>/script.sh" &
    # es decir, lo EJECUTA. Con 644 el Slurm responde "Permission denied",
    # script.sh nunca levanta el servidor, after.sh se queda esperando el
    # puerto 600s y la sesion queda en "Starting" para siempre, sin boton.
    # before.sh y after.sh si se cargan con 'source', asi que 0644 va bien.
    mode: "0755"
  - app: jupyter
    src: template/after.sh.erb.j2
    dest: template/after.sh.erb
  - app: codeserver
    src: manifest.yml.j2
    dest: manifest.yml
  - app: codeserver
    src: form.yml.j2
    dest: form.yml
  - app: codeserver
    src: submit.yml.erb.j2
    dest: submit.yml.erb
  - app: codeserver
    src: view.html.erb.j2
    dest: view.html.erb
  - app: codeserver
    src: template/before.sh.erb.j2
    dest: template/before.sh.erb
  - app: codeserver
    src: template/script.sh.erb.j2
    dest: template/script.sh.erb
    # 0755 por lo mismo que en jupyter: se ejecuta, no se sourcea.
    mode: "0755"
  - app: codeserver
    src: template/after.sh.erb.j2
    dest: template/after.sh.erb
  # Terminal en el navegador: Xvnc + xterm en el nodo, noVNC como cliente.
  # Reemplaza a sys/shell, que con Passenger 6.1.2 + Node 22/20 muere con un
  # fatal de V8 en el JIT antes de levantar la terminal.
  - app: desktop
    src: manifest.yml.j2
    dest: manifest.yml
  - app: desktop
    src: form.yml.j2
    dest: form.yml
  - app: desktop
    src: submit.yml.erb.j2
    dest: submit.yml.erb
  - app: desktop
    src: view.html.erb.j2
    dest: view.html.erb
  - app: desktop
    src: template/before.sh.erb.j2
    dest: template/before.sh.erb
  - app: desktop
    src: template/script.sh.erb.j2
    dest: template/script.sh.erb
    # 0755 por lo mismo que jupyter/codeserver: lo ejecuta el job script.
    mode: "0755"

# Node LTS con el que se arregla la app web Shell (ood-shell).
#
# No se usa el Node del sistema (/usr/bin/node, NodeSource v22) porque con el
# spawn de Passenger 6.1.2 el proceso muere con un fatal de V8 por ENOMEM
# durante el JIT ("Check failed: 12 == (*__errno_location())"). La app corre
# bien con el mismo Node fuera de Passenger, asi que el problema es la
# combinacion Passenger + Node 22, no la app.
#
# Se instala en un prefijo propio y NO se reemplaza el Node del sistema: este
# nodo aloja el portal, Grafana y el clúster, y otras apps pueden depender del
# Node que ya esta.
#
# Version y checksum salen de nodejs.org oficial. La 20.20.2 es la ultima 20.x
# ("Iron"). Para actualizar hay que cambiar las TRES cosas juntas.
ood_shell_node_version: "20.20.2"
ood_shell_node_sha256: "df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d"
ood_shell_node_prefix: "/opt/ood/node-{{ ood_shell_node_version }}"

# ----- Opciones de montaje NFS ---------------------------------------------
# NFS hace las tareas de montaje idempotentes, por lo que acá alcanza con
# declararlas; el play se encarga de montar / exportfs -ra.
# context= solo tiene efecto con SELinux (RedHat). En Ubuntu es un no-op, así
# que se agrega condicionalmente para no dejar una opción engañosa.
nfs_common_opts: rw,sync,hard,_netdev
nfs_shared_opts: "{{ nfs_common_opts }}"
nfs_home_opts: "{{ nfs_common_opts }}{{ ',context=\"system_u:object_r:user_home_t:s0\"' if ansible_os_family == 'RedHat' else '' }}"


# Open OnDemand FQDN & TLS
ood_server_name: "ondemand.utn.edu.ar"


#ood_ssl_key_path: "/etc/pki/tls/private/ood.key"
#ood_ssl_cert_path: "/etc/pki/tls/certs/ood.crt"
# El CSR va junto al certificado, no en /tmp: antes se borraba al final de cada
# corrida, lo que obligaba a regenerarlo (con clave aleatoria) en la siguiente.
#ood_ssl_csr_path: "/etc/pki/tls/certs/ood.csr"
ood_ssl_key_path: "/etc/ssl/private/ood.key"
ood_ssl_cert_path: "/etc/ssl/certs/ood.crt"
